<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sistema de Apoio & Inspeção</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#06070a;--bg2:#0a0d11;--surface:#0f1216;--surface2:#14181d;--surface3:#1a1f25;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.16);
  --accent:#ffd600;--accent2:#ffe44d;--accent3:#c8a800;
  --accent-dim:rgba(255,214,0,.06);--accent-glow:rgba(255,214,0,.15);
  --green:#10b981;--green2:#34d399;--green3:#059669;--green-dim:rgba(16,185,129,.08);
  --red:#ef4444;--red-dim:rgba(239,68,68,.08);
  --warn:#f59e0b;--warn-dim:rgba(245,158,11,.08);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,.08);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,.08);
  --text:#f0f0f2;--text2:#d4d4d8;--text3:#a1a1aa;--muted:#71717a;--dim:#3f3f46;--dimmer:#27272a;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--r-2xl:28px;
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);--shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);--safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(0,0,.2,1);
  --glass:rgba(255,255,255,.03);--glass2:rgba(255,255,255,.05);--glass3:rgba(255,255,255,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;-webkit-user-select:none;user-select:none}
input,select{font-family:var(--font);outline:none}
img,video{display:block;max-width:100%}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}
::selection{background:rgba(255,214,0,.25);color:#fff}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
#splash.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s ease}
.sp-bg{position:absolute;inset:0;overflow:hidden}
.sp-glow{position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 42%,rgba(255,214,0,.09),transparent 70%);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,black 10%,transparent 65%);-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,black 10%,transparent 65%)}
.sp-scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,214,0,.12),transparent);animation:scan 3s linear infinite}
@keyframes scan{from{top:-2px}to{top:100%}}
.sp-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.sp-logo-wrap{position:relative;width:104px;height:104px}
.sp-logo{width:100%;height:100%;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent3));display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,214,0,.25),0 24px 80px rgba(255,214,0,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.sp-title{margin-top:16px;font-size:clamp(28px,8vw,36px);font-weight:900;letter-spacing:-.03em;color:#fff}
.sp-bar{margin-top:48px;width:180px;height:3px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.sp-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:barLoad 1.1s ease-in-out both;transform-origin:left}
@keyframes barLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== MENU ===== */
#main-menu{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:var(--bg);overflow-y:auto}
.menu-inner{position:relative;z-index:1;max-width:460px;width:100%;margin:0 auto}
.menu-grid{margin-top:32px;display:flex;flex-direction:column;gap:10px}
.mc{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--glass);transition:all .2s var(--ease);text-align:left;width:100%}
.mc.pri{border-color:rgba(255,214,0,.3);background:linear-gradient(135deg,rgba(255,214,0,.08),rgba(255,214,0,.02))}
.mc-b h3{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.mc-b p{font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}

/* ===== APP SHELL ===== */
.module{display:none;min-height:100vh;min-height:100dvh;background:var(--bg)}
.module.active{display:block}
.hdr{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);background:rgba(6,7,10,.82);backdrop-filter:blur(28px);padding:0 16px;padding-top:var(--safe-t)}
.hdr-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;height:58px}
.wrap{max-width:680px;margin:0 auto;padding:16px;padding-bottom:var(--safe-b);display:flex;flex-direction:column;gap:10px}

/* Zoom bar fixada e integrada */
#zoom-bar{position:absolute;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:20px;backdrop-filter:blur(12px);z-index:200}
#zoom-bar.visible{display:flex}
</style>
</head>
<body>
  <div id="splash">
    <div class="sp-bg"><div class="sp-glow"></div></div>
    <div class="sp-content">
      <div class="sp-logo-wrap">
        <div class="sp-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>
      <div class="sp-title">Sistema de Inspeção</div>
      <div class="sp-bar"><div class="sp-bar-fill"></div></div>
    </div>
  </div>

  <div id="main-menu">
    <div class="menu-inner">
      <div class="menu-brand">
        <div class="menu-brand-text">
          <div class="meb">Painel Operacional</div>
          <div class="mt">Módulos Ativos</div>
        </div>
      </div>
      <div class="menu-grid">
        <button class="mc pri" onclick="app.openModule('inspecao')">
          <div class="mc-b">
            <h3>Iniciar Inspeção de Campo</h3>
            <p>Registro fotográfico, marcação de quilometragem e relatórios offline.</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Inicialização segura baseada na sua estrutura funcional
    const app = {
      openModule(name) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('splash').classList.add('done');
        // Adicione aqui a transição para o módulo correspondente
      }
    };
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').classList.add('done');
      }, 1200);
    });
  </script>
</body>
</html>
