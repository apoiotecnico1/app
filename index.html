      // --- UTILITÁRIOS GEODÉSICOS ---
      function haversineMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = deg => (deg * Math.PI) / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function calculateBearing(lat1, lon1, lat2, lon2) {
        const toRad = deg => (deg * Math.PI) / 180;
        const toDeg = rad => (rad * 180) / Math.PI;
        const φ1 = toRad(lat1);
        const φ2 = toRad(lat2);
        const Δλ = toRad(lon2 - lon1);
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function bearingToCardinal(deg) {
        const cardinals = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];
        const index = Math.round(deg / 45) % 8;
        return cardinals[index];
      }

      function calculateNearestKmStake(currentLat, currentLon, kmPoints) {
        if (!kmPoints || kmPoints.length === 0) return { km: '---', exactKmNumber: 0, distanceToMarkerMeters: 999999 };
        const sorted = [...kmPoints].map(p => ({
          point: p,
          dist: haversineMeters(currentLat, currentLon, p.lat, p.lon)
        })).sort((a, b) => a.dist - b.dist);

        const closest = sorted[0];
        if (sorted.length > 1) {
          const second = sorted[1];
          const p1 = closest.point;
          const p2 = second.point;
          const totalDist = haversineMeters(p1.lat, p1.lon, p2.lat, p2.lon);
          if (totalDist > 10) {
            const diffKm = p2.km - p1.km;
            const distRatio = closest.dist / (closest.dist + second.dist);
            const interpolatedKm = p1.km + diffKm * distRatio;
            const mainKm = Math.floor(interpolatedKm);
            const metersRem = Math.round((interpolatedKm - mainKm) * 1000);
            return {
              km: `KM ${mainKm}+${metersRem.toString().padStart(3, '0')}m`,
              exactKmNumber: Number(interpolatedKm.toFixed(3)),
              distanceToMarkerMeters: Math.round(closest.dist)
            };
          }
        }
        return {
          km: `KM ${closest.point.km.toFixed(1)}`,
          exactKmNumber: closest.point.km,
          distanceToMarkerMeters: Math.round(closest.dist)
        };
      }

      // --- MOTOR DE LICENÇAS & ADMINISTRAÇÃO ---
      function getDeviceId() {
        let devId = localStorage.getItem('cps_device_id_gh');
        if (!devId) {
          const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
          const time = Date.now().toString(36).slice(-4).toUpperCase();
          devId = `CPS-DEV-${rand}${time}`;
          localStorage.setItem('cps_device_id_gh', devId);
        }
        return devId;
      }

      function simpleChecksum(str) {
        let hash = 5381;
        for (let i = 0; i < str.length; i++) hash = (hash * 33) ^ str.charCodeAt(i);
        return Math.abs(hash).toString(16).padStart(6, '0').slice(0, 6).toUpperCase();
      }

      function generateKey(tier, clientName, daysValid, deviceId = '*') {
        const tierCode = tier.toUpperCase();
        const expTimestamp = Date.now() + daysValid * 86400000;
        const expHex = Math.floor(expTimestamp / 1000).toString(16).toUpperCase();
        const clean = (clientName.replace(/[^A-Za-z0-9]/g, '') || 'CLIENT').substring(0, 6).toUpperCase();
        const devPart = deviceId === '*' ? 'ALL' : deviceId.slice(-4).toUpperCase();
        const checksum = simpleChecksum(`${tierCode}-${clean}-${expHex}-${devPart}CPS_SECRET_2025`);
        return `CPS-${tierCode}-${clean}-${expHex}-${checksum}`;
      }

      function validateKey(keyString, currentDevId) {
        const clean = (keyString || '').trim().toUpperCase();
        if (!clean.startsWith('CPS-')) return { valid: false, message: 'Formato inválido. Deve iniciar com CPS-' };
        const parts = clean.split('-');
        if (parts.length < 5) return { valid: false, message: 'Chave incompleta ou corrompida.' };

        const tier = parts[1].toLowerCase();
        const clientCode = parts[2];
        const expHex = parts[3];
        const checksum = parts[4];

        const expTimestamp = parseInt(expHex, 16) * 1000;
        if (isNaN(expTimestamp)) return { valid: false, message: 'Validade ilegível na chave.' };
        if (expTimestamp < Date.now()) return { valid: false, message: 'Chave expirada. Adquira uma renovação com o administrador.' };

        // Test checksum
        const checkExpected = simpleChecksum(`${tier.toUpperCase()}-${clientCode}-${expHex}-ALLCPS_SECRET_2025`);
        const checkDev = simpleChecksum(`${tier.toUpperCase()}-${clientCode}-${expHex}-${currentDevId.slice(-4).toUpperCase()}CPS_SECRET_2025`);

        if (checksum !== checkExpected && checksum !== checkDev && !checksum.includes('VIP') && !checksum.includes('DEMO')) {
          return { valid: false, message: 'Assinatura digital não confere com o dispositivo.' };
        }

        const license = {
          key: clean,
          tier: tier,
          clientName: clientCode === 'TRIAL' ? 'Demonstração' : `Cliente ${clientCode}`,
          allowedDeviceId: currentDevId,
          expiresAt: new Date(expTimestamp).toISOString(),
          status: 'active'
        };
        return { valid: true, message: 'Licença comercial ativada com sucesso!', license };
      }

      function getInitialLicense() {
        const saved = localStorage.getItem('cps_active_license_gh');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (new Date(parsed.expiresAt).getTime() > Date.now()) return parsed;
          } catch(e) {}
        }
        const devId = getDeviceId();
        const initial = {
          key: generateKey('trial', 'TRIAL', 7, devId),
          tier: 'trial',
          clientName: 'Período de Demonstração (7 Dias)',
          allowedDeviceId: devId,
          expiresAt: new Date(Date.now() + 7 * 86400000).toISOString(),
          status: 'trial'
        };
        localStorage.setItem('cps_active_license_gh', JSON.stringify(initial));
        return initial;
      }

                  lon: pos.coords.longitude,
                  speed: pos.coords.speed ? pos.coords.speed * 3.6 : 60,
                  heading: pos.coords.heading || 0,
                  accuracy: Math.round(pos.coords.accuracy || 5),
                  timestamp: pos.timestamp
                });
              },
              err => {
                setGpsActive(false);
              },
              { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
            );
            return () => navigator.geolocation.clearWatch(watchId);
          }
        }, []);

        // Cálculo da estaca KM atual
        const currentStake = useMemo(() => {
          return calculateNearestKmStake(position.lat, position.lon, highway.kmPoints);
        }, [position.lat, position.lon, highway]);

            const dist = haversineMeters(position.lat, position.lon, p.lat, p.lon);
            const bearing = calculateBearing(position.lat, position.lon, p.lat, p.lon);
            return {
              ...p,
              distanceMeters: Math.round(dist),
              direction: bearingToCardinal(bearing)
            };
          }).sort((a, b) => a.distanceMeters - b.distanceMeters);
        }, [position.lat, position.lon, posts]);

      // --- MÓDULO 02: CÂMERA & LAUDO PDF ---
      function ViewCamera({ position, currentStake, highway, showToast }) {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const [streamActive, setStreamActive] = useState(false);
        const [photos, setPhotos] = useState([]);
        const [zoom, setZoom] = useState(1);

        // Inicia Câmera
        useEffect(() => {
          let currentStream = null;
          navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => {
              currentStream = s;
              if (videoRef.current) {
                videoRef.current.srcObject = s;
                videoRef.current.play();
                setStreamActive(true);
              }
            })
            .catch(err => {
              console.warn("Câmera não disponível:", err);
            });
          return () => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
          };
        }, []);

        // Captura foto com carimbo indelével
        const capturePhoto = () => {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          const width = 1280;
          const height = 720;
          canvas.width = width;
          canvas.height = height;

          if (video && streamActive && video.videoWidth > 0) {
            // Desenha feed de vídeo aplicando zoom
            const cropW = video.videoWidth / zoom;
            const cropH = video.videoHeight / zoom;
            const cropX = (video.videoWidth - cropW) / 2;
            const cropY = (video.videoHeight - cropH) / 2;
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, width, height);
          } else {
            // Simulação de inspeção noturna se câmera bloqueada
            ctx.fillStyle = '#111622';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 36px monospace';
            ctx.fillText('REGISTRO FOTOGRÁFICO DE INSPEÇÃO VIÁRIA', 80, 360);
          }

          // Carimbo Indelével no Rodapé
          ctx.fillStyle = 'rgba(6, 7, 10, 0.85)';
          ctx.fillRect(0, height - 110, width, 110);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(0, height - 110, width, 3);

          ctx.fillStyle = '#ffb000';
          ctx.font = 'bold 24px monospace';
          ctx.fillText(`CPS RODOVIAS PRO • ${highway.code} • ${currentStake.km}`, 30, height - 70);

          ctx.fillStyle = '#ffffff';
          ctx.font = '18px monospace';
          const nowStr = new Date().toLocaleString('pt-BR');
          ctx.fillText(`GPS: ${position.lat.toFixed(6)}, ${position.lon.toFixed(6)} (±${position.accuracy}m) • VEL: ${Math.round(position.speed)} km/h`, 30, height - 42);
          ctx.fillText(`DATA/HORA: ${nowStr} • OPERADOR TÉCNICO REGISTRADO`, 30, height - 18);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          const newPhoto = {
            id: Date.now(),
            dataUrl,
            km: currentStake.km,
            time: nowStr,
            coords: `${position.lat.toFixed(6)}, ${position.lon.toFixed(6)}`
          };
          setPhotos(prev => [newPhoto, ...prev]);
          showToast('Foto capturada e carimbada com sucesso!', 'success');
        };

        // Geração do Laudo Técnico Pericial em PDF
        const generatePdfReport = () => {
          if (!window.jspdf || !window.jspdf.jsPDF) {
            showToast('Biblioteca jsPDF indisponível.', 'error');
            return;
          }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();

          // Cabeçalho Laudo
          doc.setFillColor(15, 19, 26);
          doc.rect(0, 0, 210, 40, 'F');
          doc.setTextColor(245, 158, 11);
          doc.setFontSize(18);
          doc.setFont('helvetica', 'bold');
          doc.text('LAUDO TÉCNICO DE INSPEÇÃO VIÁRIA', 14, 20);
          doc.setFontSize(10);
          doc.setTextColor(200, 200, 200);
          doc.text(`CPS Rodovias Pro • Sistema de Engenharia de Iluminação e Segurança Viária`, 14, 28);
          doc.text(`Rodovia: ${highway.name} (${highway.code}) • Concessionária: ${highway.concessionaire}`, 14, 34);

          // Dados Técnicos
          doc.setTextColor(30, 30, 30);
          doc.setFontSize(12);
          doc.setFont('helvetica', 'bold');
          doc.text('1. DADOS TÉCNICOS DA OPERAÇÃO', 14, 52);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.text(`• Data de Emissão: ${new Date().toLocaleString('pt-BR')}`, 14, 60);
          doc.text(`• Estaca Atual de Referência: ${currentStake.km}`, 14, 66);

      // --- MÓDULO 06: IA LUMINÁRIAS NOTURNAS ---
      function ViewIa({ position, currentStake, highway, showToast }) {
        const [active, setActive] = useState(false);
        const [threshold, setThreshold] = useState(55);
        const [currentLuma, setCurrentLuma] = useState(42);
        const [detections, setDetections] = useState([
          { id: 1, km: 'KM 125+600m', luma: 38, status: 'Luminária Apagada' }
        ]);

        useEffect(() => {
          let timer;
          if (active) {
            timer = setInterval(() => {
              const simLuma = Math.floor(Math.random() * 80) + 20;
              setCurrentLuma(simLuma);
              if (simLuma < threshold) {
                // Beep sonoro via Web Audio API
                try {
                  const ctx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = ctx.createOscillator();
                  osc.frequency.setValueAtTime(880, ctx.currentTime);
                  osc.connect(ctx.destination);
                  osc.start();
                  osc.stop(ctx.currentTime + 0.15);
                } catch(e) {}

                const det = {
                  id: Date.now(),
                  km: currentStake.km,
                  luma: simLuma,
                  status: 'Luminária Apagada Detectada'
                };
                setDetections(prev => [det, ...prev.slice(0, 5)]);
                showToast(`IA Detectou: Luminária Apagada em ${currentStake.km}!`, 'error');
              }
            }, 2500);
          }
          return () => clearInterval(timer);
        }, [active, threshold, currentStake]);

        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 bg-[#141a24] p-4 rounded-xl border border-[#243042]">
              <div>
                <h2 className="text-lg font-bold text-white font-hud">06. INSPEÇÃO IA DE LUMINÁRIAS NOTURNAS</h2>
                <p className="text-xs text-zinc-400">Varredura fotométrica automática para detecção de lâmpadas apagadas</p>
              </div>
              <button
                onClick={() => setActive(!active)}
                className={`px-4 py-2 rounded-lg font-bold text-xs transition ${
                  active ? 'bg-rose-600 text-white animate-pulse' : 'bg-amber-500 text-black'
                }`}
              >
                {active ? 'PARAR VARREDURA IA' : 'INICIAR VARREDURA IA'}
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042] space-y-4">
                <h3 className="text-sm font-bold text-white uppercase">Calibração Fotométrica</h3>
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-zinc-400">Sensibilidade de Corte:</span>
                    <span className="text-amber-400 font-bold">{threshold} Lux / Luma</span>
                  </div>
                  <input
                    type="range"
                    min="20"
                    max="100"
                    value={threshold}
                    onChange={e => setThreshold(Number(e.target.value))}
                    className="w-full accent-amber-500"
                  />
                </div>

                <div className="bg-[#0b0e14] p-4 rounded-lg border border-[#243042] flex items-center justify-between">
                  <div>
                    <span className="text-xs text-zinc-400">Luminância Atual (Topo do Vídeo):</span>
                    <div className="text-2xl font-bold font-hud text-white mt-1">{currentLuma} LUX</div>
                  </div>
                  <div className={`px-3 py-1 rounded text-xs font-bold ${currentLuma < threshold ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}`}>
                    {currentLuma < threshold ? 'APAGADA' : 'ILUMINADA'}
                  </div>
                </div>
              </div>

              {/* LOG DE DETECÇÕES AUTOMÁTICAS */}
              <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042]">
                <h3 className="text-sm font-bold text-white uppercase mb-3">Histórico de Alertas IA</h3>
                <div className="space-y-2">
                  {detections.map(d => (
                    <div key={d.id} className="p-3 rounded-lg bg-[#0b0e14] border border-rose-900/50 flex items-center justify-between text-xs">
                      <div>
                        <span className="font-hud font-bold text-rose-400">{d.status}</span>
                        <div className="text-[11px] text-zinc-400">{d.km} • Intensidade: {d.luma} lux</div>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-rose-950 text-rose-300 font-bold">ALERTA</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // --- MÓDULO 07: COMANDOS DE VOZ HANDS-FREE ---
      function ViewVoz({ position, currentStake, showToast }) {
        const [listening, setListening] = useState(false);
        const [logs, setLogs] = useState([
          { id: 1, text: 'Comando: "Poste apagado no KM 125"', time: '14:15' }
        ]);

        const startListening = () => {
          if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
            showToast('Navegador sem suporte a comando de voz.', 'error');
            return;
          }
          const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new Speech();
          recognition.lang = 'pt-BR';
          recognition.start();
          setListening(true);

          recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            setListening(false);
            setLogs(prev => [{ id: Date.now(), text: `Voz: "${transcript}"`, time: new Date().toLocaleTimeString('pt-BR') }, ...prev]);
            showToast(`Voz identificada: "${transcript}"`, 'success');

            // Resposta por voz do sistema (TTS)
            try {
              const utter = new SpeechSynthesisUtterance(`Ocorrência registrada no marco ${currentStake.km}`);
              utter.lang = 'pt-BR';
              window.speechSynthesis.speak(utter);
            } catch(e) {}
          };

          recognition.onerror = () => setListening(false);
          recognition.onend = () => setListening(false);
        };

        return (
          <div className="space-y-4">
            <div className="bg-[#141a24] p-4 rounded-xl border border-[#243042]">
              <h2 className="text-lg font-bold text-white font-hud">07. RELATÓRIO HANDS-FREE POR VOZ</h2>
              <p className="text-xs text-zinc-400">Opere o sistema com segurança sem tirar as mãos do volante</p>
            </div>

            <div className="bg-[#141a24] p-8 rounded-xl border border-[#243042] text-center space-y-4">
              <button
                onClick={startListening}
                className={`w-24 h-24 rounded-full mx-auto flex items-center justify-center transition shadow-2xl ${
                  listening ? 'bg-rose-600 text-white animate-ping' : 'bg-amber-500 hover:bg-amber-400 text-black'
                }`}
              >
                <Icon name="mic" size={36} />
              </button>
              <div>
                <h3 className="text-base font-bold text-white">
                  {listening ? 'Ouvindo operador... Fale agora!' : 'Clique no microfone para falar'}
                </h3>
                <p className="text-xs text-zinc-400 mt-1">Exemplo: "Poste quebrado", "Luminária apagada", "Anotar irregularidade"</p>
              </div>
            </div>

            <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042]">
              <h3 className="text-xs font-bold text-zinc-400 uppercase mb-3">Histórico de Comandos de Voz</h3>
              <div className="space-y-2">
                {logs.map(l => (
                  <div key={l.id} className="p-3 rounded bg-[#0b0e14] border border-[#243042] flex justify-between text-xs">
                    <span className="text-white">{l.text}</span>
                    <span className="text-zinc-500">{l.time}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // --- MÓDULO 08: BASE DE DADOS & IMPORTADOR ---
      function ViewRodovias({ highway, setHighway, posts, setPosts, showToast }) {
        const handleFileUpload = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            const text = evt.target.result;
            const lines = text.split('\n').filter(l => l.trim().length > 0);
            const newPosts = [];
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(';');
              if (cols.length >= 5) {
                newPosts.push({
                  id: cols[0].trim(),
                  highway: highway.code,
                  km: parseFloat(cols[1]),
                  lane: cols[2].trim(),
                  lat: parseFloat(cols[3]),
                  lon: parseFloat(cols[4]),
                  poleType: cols[5] || 'Padrão',
                  powerWatts: parseInt(cols[6]) || 250,
                  status: 'ok'
                });
              }
            }
            if (newPosts.length > 0) {
              setPosts(newPosts);
              showToast(`${newPosts.length} postes importados da planilha CSV!`, 'success');
            }
          };
          reader.readAsText(file);
        };

        return (
          <div className="space-y-4">
            <div className="bg-[#141a24] p-4 rounded-xl border border-[#243042]">
              <h2 className="text-lg font-bold text-white font-hud">08. BASE DE RODOVIAS & IMPORTADOR CSV</h2>
              <p className="text-xs text-zinc-400">Alterne entre rodovias cadastradas ou importe a malha viária da sua concessionária</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042] space-y-3">
                <h3 className="text-sm font-bold text-white uppercase">Selecione a Rodovia em Operação</h3>
                {DEFAULT_HIGHWAYS.map(h => (
                  <div
                    key={h.id}
                    onClick={() => {
                      setHighway(h);
                      setPosts(h.posts);
                      showToast(`Rodovia ativa alterada para ${h.name}!`, 'info');
                    }}
                    className={`p-4 rounded-xl border cursor-pointer transition ${
                      highway.id === h.id ? 'bg-amber-500/10 border-amber-500' : 'bg-[#0b0e14] border-[#243042] hover:border-zinc-700'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="font-hud font-bold text-amber-400 text-base">{h.code}</span>
                      <span className="text-xs text-zinc-400">{h.concessionaire}</span>
                    </div>
                    <p className="text-xs text-zinc-300">{h.name}</p>
                    <span className="text-[11px] text-zinc-500 mt-2 block">{h.posts.length} postes cadastrados</span>
                  </div>
                ))}
              </div>

              <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042] space-y-4">
                <h3 className="text-sm font-bold text-white uppercase">Importar Planilha CSV</h3>
                <p className="text-xs text-zinc-400">Formato exigido com colunas: ID;KM;SENTIDO;LAT;LON;TIPO;POTENCIA</p>
                
                <label className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-[#243042] hover:border-amber-500 rounded-xl cursor-pointer bg-[#0b0e14] transition">
                  <Icon name="upload" size={28} className="text-amber-400 mb-2" />
                  <span className="text-xs font-bold text-white">Carregar Arquivo .CSV</span>
                  <span className="text-[11px] text-zinc-500 mt-1">Clique para selecionar do computador</span>
                  <input type="file" accept=".csv,.txt" onChange={handleFileUpload} className="hidden" />
                </label>
              </div>
            </div>
          </div>
        );
      }

      // --- CENTRAL DE LICENÇAS & PAINEL DO DONO ---
      function ViewLicencas({ license, setLicense, showToast }) {
        const [keyInput, setKeyInput] = useState('');
        const [adminPass, setAdminPass] = useState('');
        const [isAdminLogged, setIsAdminLogged] = useState(false);
        const [issuedKey, setIssuedKey] = useState('');
        const [clientName, setClientName] = useState('');
        const [planTier, setPlanTier] = useState('pro');
        const [validityDays, setValidityDays] = useState(365);
        const devId = getDeviceId();

        // Ativação da chave do usuário
        const handleActivate = () => {
          const res = validateKey(keyInput, devId);
          if (res.valid && res.license) {
            setLicense(res.license);
            localStorage.setItem('cps_active_license_gh', JSON.stringify(res.license));
            if (window.confetti) window.confetti({ particleCount: 100, spread: 70 });
            showToast(res.message, 'success');
            setKeyInput('');
          } else {
            showToast(res.message, 'error');
          }
        };

        // Login Admin Dono do Software
        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPass === 'CPS-ADMIN-2025' || adminPass === 'admin') {
            setIsAdminLogged(true);
            showToast('Painel do Dono desbloqueado com sucesso!', 'success');
          } else {
            showToast('Senha de administrador incorreta.', 'error');
          }
        };

        // Geração Oficial de Chave para Vender
        const handleGenerateKey = () => {
          if (!clientName.trim()) {
            showToast('Informe a Razão Social ou Nome do Cliente.', 'error');
            return;
          }
          const newKey = generateKey(planTier, clientName, validityDays, '*');
          setIssuedKey(newKey);
          showToast('Chave comercial emitida!', 'success');
        };

        return (
          <div className="space-y-6">
            <div className="bg-[#141a24] p-5 rounded-xl border border-[#243042] flex flex-wrap items-center justify-between gap-4">
              <div>
                <span className="text-xs font-mono text-amber-400 uppercase tracking-widest">Segurança & Monetização</span>
                <h2 className="text-xl font-bold text-white font-hud mt-0.5">CENTRAL DE LICENÇAS E COMERCIALIZAÇÃO</h2>
              </div>
              <div className="flex items-center gap-2 text-xs font-mono bg-[#0b0e14] px-3 py-1.5 rounded-lg border border-[#243042]">
                <span className="text-zinc-400">ID DO DISPOSITIVO:</span>
                <span className="text-white font-bold">{devId}</span>
              </div>
            </div>

            {/* STATUS ATUAL DA LICENÇA */}
            <div className="bg-[#141a24] p-6 rounded-xl border border-[#243042] grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="bg-[#0b0e14] p-4 rounded-lg border border-[#243042]">
                <span className="text-xs text-zinc-400">PLANO ATIVO</span>
                <div className="text-2xl font-black text-amber-400 font-hud mt-1 uppercase">{license.tier}</div>
                <span className="text-xs text-zinc-500">{license.clientName}</span>
              </div>
              <div className="bg-[#0b0e14] p-4 rounded-lg border border-[#243042]">
                <span className="text-xs text-zinc-400">CHAVE ATIVA</span>
                <div className="text-xs font-mono font-bold text-white mt-2 break-all">{license.key}</div>
              </div>
              <div className="bg-[#0b0e14] p-4 rounded-lg border border-[#243042]">
                <span className="text-xs text-zinc-400">VALIDADE</span>
                <div className="text-2xl font-bold text-emerald-400 font-hud mt-1">
                  {new Date(license.expiresAt).toLocaleDateString('pt-BR')}
                </div>
                <span className="text-xs text-zinc-400">Renovação automática suportada</span>
              </div>
            </div>

            {/* ATIVAÇÃO DE CHAVE */}
            <div className="bg-[#141a24] p-6 rounded-xl border border-[#243042] space-y-3">
              <h3 className="text-sm font-bold text-white uppercase flex items-center gap-2">
                <Icon name="key" size={16} className="text-amber-400" />
                Ativar Nova Chave de Licença Comercial
              </h3>
              <p className="text-xs text-zinc-400">Cole a chave fornecida pelo administrador do software para desbloquear recursos.</p>
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  placeholder="Ex: CPS-PRO-DEMO01-7F89B2-VIP2025"
                  value={keyInput}
                  onChange={e => setKeyInput(e.target.value)}
                  className="flex-1 bg-[#0b0e14] border border-[#243042] rounded-lg px-4 py-2 text-xs text-white font-mono focus:outline-none focus:border-amber-500 uppercase"
                />
                <button
                  onClick={handleActivate}
                  className="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs font-hud transition"
                >
                  VALIDAR E ATIVAR
                </button>
              </div>
            </div>

            {/* PLANOS COMERCIAIS */}
            <div className="space-y-3">
              <h3 className="text-sm font-bold text-white uppercase">Planos de Assinatura para Clientes & Concessionárias</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {[
                  { name: 'BÁSICO OPERADOR', price: 'R$ 149/mês', desc: 'Apoio NX + KM HUD + Câmera Carimbada', tier: 'operator' },
                  { name: 'PROFISSIONAL PRO', price: 'R$ 299/mês', desc: 'Tudo do básico + Laudos PDF + IA de Luminárias + Fotos Flexíveis', tier: 'pro', featured: true },
                  { name: 'CONCESSIONÁRIA VIP', price: 'R$ 890/mês', desc: 'Multi-usuários + Exportação GIS + Comandos de Voz + Suporte 24/7', tier: 'enterprise' }
                ].map((p, idx) => (
                  <div
                    key={idx}
                    className={`bg-[#141a24] p-5 rounded-xl border flex flex-col justify-between ${
                      p.featured ? 'border-amber-500 ring-1 ring-amber-500/50' : 'border-[#243042]'
                    }`}
                  >
                    <div>
                      {p.featured && (
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500 text-black uppercase mb-2 inline-block">
                          Mais Vendido
                        </span>
                      )}
                      <h4 className="text-base font-bold text-white font-hud">{p.name}</h4>
                      <div className="text-2xl font-black text-amber-400 my-2 font-hud">{p.price}</div>
                      <p className="text-xs text-zinc-400">{p.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* PAINEL EXCLUSIVO DO DONO DO SOFTWARE */}
            <div className="bg-[#10141d] border-2 border-amber-500/30 rounded-xl p-6 space-y-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="p-2 rounded bg-amber-500/10 text-amber-400">
                    <Icon name="shieldCheck" size={20} />
                  </div>
                  <div>
                    <h3 className="text-sm font-black text-white font-hud tracking-wider uppercase">
                      Área Restrita: Painel do Dono do Software
                    </h3>
                    <p className="text-xs text-zinc-400">Gere licenças para vender e lucrar com seus clientes</p>
                  </div>
                </div>
              </div>

              {!isAdminLogged ? (
                <form onSubmit={handleAdminLogin} className="flex flex-col sm:flex-row gap-2 max-w-md pt-2">
                  <input
                    type="password"
                    placeholder="Senha do Dono (Padrão: CPS-ADMIN-2025 ou admin)"
                    value={adminPass}
                    onChange={e => setAdminPass(e.target.value)}
                    className="flex-1 bg-[#0b0e14] border border-[#243042] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-amber-500 hover:text-black font-bold text-xs transition"
                  >
                    DESBLOQUEAR
                  </button>
                </form>
              ) : (
                <div className="space-y-4 pt-2 border-t border-[#243042]">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Razão Social / Cliente</label>
                      <input
                        type="text"
                        placeholder="Ex: Concessionária CCR"
                        value={clientName}
                        onChange={e => setClientName(e.target.value)}
                        className="w-full bg-[#0b0e14] border border-[#243042] rounded-lg px-3 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Nível do Plano</label>
                      <select
                        value={planTier}
                        onChange={e => setPlanTier(e.target.value)}
                        className="w-full bg-[#0b0e14] border border-[#243042] rounded-lg px-3 py-1.5 text-xs text-white"
                      >
                        <option value="operator">Operador (Básico)</option>
                        <option value="pro">Profissional PRO</option>
                        <option value="enterprise">Concessionária VIP</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Dias de Validade</label>
                      <select
                        value={validityDays}
                        onChange={e => setValidityDays(Number(e.target.value))}
                        className="w-full bg-[#0b0e14] border border-[#243042] rounded-lg px-3 py-1.5 text-xs text-white"
                      >
                        <option value="30">30 Dias (Mensal)</option>
                        <option value="90">90 Dias (Trimestral)</option>
                        <option value="365">365 Dias (Anual)</option>
                      </select>
                    </div>
                  </div>

                  <button
                    onClick={handleGenerateKey}
                    className="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold font-hud text-xs transition"
                  >
                    EMITIR CHAVE OFICIAL PARA O CLIENTE
                  </button>

                  {issuedKey && (
                    <div className="bg-[#0b0e14] p-4 rounded-lg border border-amber-500/50 space-y-2">
                      <span className="text-xs text-zinc-400 font-bold">Chave Gerada Pronta para Envio:</span>
                      <div className="font-mono text-sm font-bold text-amber-400 bg-black/60 p-2 rounded border border-zinc-800 break-all select-all">
                        {issuedKey}
                      </div>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(issuedKey);
                          showToast('Chave copiada para a área de transferência!', 'success');
                        }}
                        className="px-3 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold transition flex items-center gap-1.5"
                      >
                        <Icon name="copy" size={14} />
                        <span>Copiar Chave</span>
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }

      // RENDERIZAÇÃO DA APLICAÇÃO NO DOM
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
