<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitário Otimizado - Alta Velocidade</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
        }
        input {
            flex: 1;
            background: #0f172a;
            color: var(--text-color);
        }
        button {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Alta Performance</h1>
    
    <div class="form-group">
        <input type="text" id="inputText" placeholder="Digite um registro..." autofocus>
        <button onclick="adicionarItem()">Adicionar</button>
    </div>

    <ul id="listaRegistros">
        <!-- Os itens serão renderizados aqui instantaneamente via RAM -->
    </ul>
</div>

<script>
    // 1. Estado Global em Memória RAM
    let dbCache = [];
    const STORAGE_KEY = "app_cache_dados";

    // 2. Carregamento Único ao Iniciar (Evita leituras repetidas do disco)
    document.addEventListener("DOMContentLoaded", () => {
        const dadosSalvos = localStorage.getItem(STORAGE_KEY);
        if (dadosSalvos) {
            try {
                dbCache = JSON.parse(dadosSalvos);
            } catch (e) {
                console.error("Erro ao carregar cache local:", e);
                dbCache = [];
            }
        }
        renderizarInterface();
    });

    // 3. Persistência Controlada (Único ponto que grava no disco)
    function persistirDados() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dbCache));
    }

    // 4. Adicionar Item (Atualiza a RAM instantaneamente e reflete na tela)
    function adicionarItem() {
        const input = document.getElementById("inputText");
        const valor = input.value.trim();
        
        if (!valor) return;

        const novoRegistro = {
            id: Date.now(), // ID único baseado em timestamp
            texto: valor
        };

        // Mutação direto na RAM
        dbCache.push(novoRegistro);

        // Salva no disco e atualiza a UI
        persistirDados();
        renderizarInterface();

        // Limpa o campo e foca novamente para agilizar a digitação
        input.value = "";
        input.focus();
    }

    // 5. Remover Item
    function removerItem(id) {
        dbCache = dbCache.filter(item => item.id !== id);
        persistirDados();
        renderizarInterface();
    }

    // 6. Renderização Otimizada do DOM
    function renderizarInterface() {
        const listaEl = document.getElementById("listaRegistros");
        
        // Se estiver vazio
        if (dbCache.length === 0) {
            listaEl.innerHTML = `<li style="justify-content: center; color: #64748b;">Nenhum registro encontrado.</li>`;
            return;
        }

        // Montagem eficiente do HTML em lote para evitar múltiplos reflows do navegador
        let htmlAcumulado = "";
        for (let i = 0; i < dbCache.length; i++) {
            const item = dbCache[i];
            htmlAcumulado += `
                <li>
                    <span>${escapeHtml(item.texto)}</span>
                    <button class="btn-delete" onclick="removerItem(${item.id})">Excluir</button>
                </li>
            `;
        }
        listaEl.innerHTML = htmlAcumulado;
    }

    // Função de segurança básica para evitar injeção de HTML
    function escapeHtml(text) {
        return text.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // Atalho com a tecla Enter para agilizar a inserção
    document.getElementById("inputText").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            adicionarItem();
        }
    });
</script>

</body>
</html>
