Segue a versão atualizada e completa do HTML com o novo módulo **"Captura Rápida"**, utilizando o mesmo padrão de design existente. O módulo foi adicionado à tela inicial como o quarto botão no menu principal:

```html
<!DOCTYPE html>
<html lang="pt-BR"

> <head>
<meta charset="utf-8"

> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"

> <meta name="theme-color" content="#0b1020"

> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"

> <title>Sistema de Apoio & Inspeção</title>
<style>
:root {
  --bg: #050816;
  --bg2: #090f1f;
  --surface: #0d1224;
  --violet: #5b21ff;
  --accent: #ffd600;
  --green: #10b981;
  --text: #f3f4f6;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
#main-menu {
  max-width: 540px;
  margin: 0 auto;
  padding: 20px;
}
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
/* Botão do menu */
button {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  border: 1px solid var(--surface);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  padding: 10px;
  text-align: left;
  cursor: pointer;
}
button span.icon {
  display: inline-block;
  width: 44px;
  height: 44px;
  background: var(--violet);
  border-radius: 8px;
  margin-right: 10px;
  display: grid;
  place-items: center;
}
button span.icon svg {
  width: 24px;
  height: 24px;
  color: var(--text);
}
button h3 {
  font-size: 14px;
  font-weight: bold;
  margin: 0;
}
button p {
  font-size: 12px;
  color: var(--text);
  opacity: 0.7;
}
.module {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg2);
  color: var(--text);
  padding: 20px;
}
.module.active {
  display: block;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--surface);
}
header button {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--surface);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
}
.wrap {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 20px;
}
.ctrl-send {
  background: var(--green);
  color: var(--text);
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
}
.ctrl-option {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ctrl-option label {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ctrl-option input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--violet);
}
.ctrl-option input[type="text"] {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--surface);
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="main-menu"

>   <h1>Sistema de Apoio & Inspeção</h1>
  <p>Selecione o sistema desejado:</p>
  <div class="menu-grid"

>     <button onclick="openModule('apoio-localizacao')"

>       <span class="icon"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

>           <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <div>
        <h3>Apoio Localização</h3>
        <p>Encontre postes e IDs NX com GPS e lista para WhatsApp.</p>
      </div>
    </button>
    <button onclick="openModule('inspecao-fotografica')"

>       <span class="icon"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

>           <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/>
        </svg>
      </span>
      <div>
        <h3>Inspeção Fotográfica</h3>
        <p>Captura automática de fotos e relatórios PDF com KM e etiquetas.</p>
      </div>
    </button>
    <button onclick="openModule('km-tempo-real')"

>       <span class="icon"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

>           <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </span>
      <div>
        <h3>KM em Tempo Real</h3>
        <p>Painel com o quilômetro atual utilizando GPS.</p>
      </div>
    </button>
    <button onclick="openModule('captura-rapida')"

>       <span class="icon"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

>           <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </span>
      <div>
        <h3>Captura Rápida</h3>
        <p>Tire fotos ou grave vídeos com KM, GPS e etiquetas opcionais.</p>
      </div>
    </button>
  </div>
</div>

<!-- Módulo Captura Rápida -->
<div id="captura-rapida" class="module"

>   <header>
    <button onclick="closeModule()">←</button>
    <h1>Captura Rápida</h1>
  </header>
  <div class="wrap"

>     <button class="ctrl-send" onclick="tirarFoto()">📸 Capturar Foto Rápida</button>
    <button class="ctrl-send" onclick="gravarVideo()">🎥 Iniciar Gravação de Vídeo</button>
    <div class="ctrl-option"

>       <label>
        <input type="checkbox" id="km-option"

> Incluir KM na Captura
      </label>
      <label>
        <input type="checkbox" id="gps-option"

> Incluir GPS na Captura
      </label>
      <label>
        Etiqueta (opcional):
        <input type="text" id="etiqueta-option" placeholder="Insira a etiqueta"

>       </label>
    </div>
  </div>
</div>

<script>
function openModule(id) {
  document.querySelectorAll('.module').forEach(mod => mod.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function closeModule() {
  document.querySelectorAll('.module').forEach(mod => mod.classList.remove('active'));
}

function tirarFoto() {
  alert('Função para capturar foto rápida com KM, GPS e etiqueta.');
}

function gravarVideo() {
  alert('Função para iniciar gravação de vídeo.');
}
</script>
</body>
</html>
