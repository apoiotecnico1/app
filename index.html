
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sistema de Apoio à Localização</title>
<link rel="stylesheet" href="styles.css">
<script src="apoio.js" defer></script>
</head>
<body>
<!-- Sistema de Apoio à Localização -->
<div id="mod-apoio" class="module">
<header class="hdr">
<div class="hdr-in">
<button class="hdr-back" onclick="openMod('menu')" aria-label="Voltar">Voltar</button>
<div class="hdr-title">
<h1>Apoio localização</h1>
<p>Postes e ordens de serviço</p>
</div>
</div>
</header>
<div class="wrap">
<div id="targetLock" class="target-lock">
<h2>Você está no poste!</h2>
<p id="targetLockSub">ID ALVO: --- | DISTÂNCIA < 5M</p>
</div>
<div class="card card-accent">
<p class="card-label">Localizar ordem de serviço</p>
<div class="search-row">
<div class="search-wrap">
<input class="search-input" id="inputId" placeholder="EX: 1800 - 1400" autocomplete="off" spellcheck="false">
<button class="btn-icon go" onclick="searchId()" aria-label="Buscar">Buscar</button>
<button class="btn-icon clr" onclick="clearId()" aria-label="Limpar">Limpar</button>
</div>
</div>
<div id="searchMsg" class="search-msg" style="display:none"></div>
<div id="searchResult" style="display:none;margin-top:12px"></div>
</div>
<div class="km-hero compact">
<p class="km-label">KM atual na rodovia</p>
<p class="km-value" id="kmVal">—</p>
<p class="km-sub" id="kmSource"></p>
</div>
<div id="gpsStatus" class="gps bad">GPS · BUSCANDO SINAL</div>
<div id="postList" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
</div>
</body>
</html>
