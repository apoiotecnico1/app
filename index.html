<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Apoio Técnico — Central de Operação</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#071015; --card:#0e1f27; --fg:#e6f1f4; --muted:#7d97a3; --border:#1c3441;
    --yellow:#ffd74d; --green:#21c77d; --red:#ff5c5c; --orange:#ff9a3c; --blue:#3aa6ff; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at top,#0e2230,#071015 60%);color:var(--fg);overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  header.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(7,16,21,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .topbar .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .topbar h2{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin:0}
  .topbar p{font-size:10px;color:var(--muted);margin:0}
  main{flex:1;padding:16px;padding-bottom:84px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{padding:14px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,var(--yellow),#e8b53a);color:#071015}
  .btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .btn-danger{background:linear-gradient(135deg,#ff5c5c,#c22929);color:#fff}
  .btn-green{background:linear-gradient(135deg,var(--green),#178a5a);color:#071015}
  .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid}
  .b-pendente{color:#ffd74d;background:rgba(255,215,77,.1);border-color:rgba(255,215,77,.4)}
  .b-em_andamento{color:#3aa6ff;background:rgba(58,166,255,.1);border-color:rgba(58,166,255,.4)}
  .b-resolvido{color:#21c77d;background:rgba(33,199,125,.1);border-color:rgba(33,199,125,.4)}
  .b-inspecionado{color:#ff9a3c;background:rgba(255,154,60,.1);border-color:rgba(255,154,60,.4)}
  .gps-box{text-align:center;border-radius:12px;padding:12px;font-size:11px;font-weight:800}
  .gps-ok{color:#21c77d;background:rgba(33,199,125,.1);border:1px solid rgba(33,199,125,.4)}
  .gps-warn{color:#ff9a3c;background:rgba(255,154,60,.1);border:1px solid rgba(255,154,60,.4)}
  .gps-bad{color:#ff5c5c;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.4)}
  input,select,textarea{width:100%;background:#0a161c;border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--fg);font-size:14px;font-family:inherit}
  label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,16,21,.95);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:10px;font-weight:800;color:var(--muted);text-decoration:none}
  nav.bottom a.on{color:var(--yellow)}
  nav.bottom svg{width:22px;height:22px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .stat .n{font-size:26px;font-weight:900}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px;cursor:pointer}
  .pill{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--border);background:rgba(255,255,255,.04);text-decoration:none}
  #map,#map2,#map3{height:260px;border-radius:14px;border:1px solid var(--border)}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0e1f27;border:1px solid var(--yellow);color:var(--yellow);padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}
  .drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none}
  .drawer.on{display:block}
  .drawer .sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
  .chk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
  .chk input{width:20px;height:20px;flex:0}
  .hidden{display:none}
  .big{font-size:40px;font-weight:900}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
  .tag{font-size:10px;color:var(--muted)}
  .photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .grid-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .module{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--card);text-decoration:none;color:var(--fg)}
  .module .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,215,77,.12);color:var(--yellow)}
  .module h3{margin:0;font-size:14px}
  .module p{margin:0;font-size:11px;color:var(--muted)}
  .cam-wrap{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden}
  video{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <nav class="bottom" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const I = {
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="6" y="6" width="12" height="12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><path d="M5 12l5 5L20 7"/></svg>'
};

const DB = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('cps_'+k)) ?? d; }catch{ return d; } },
  set(k,v){ localStorage.setItem('cps_'+k, JSON.stringify(v)); }
};

let POS=null, POS_ERR=null, WATCH=null;
let KMS = [], REGS = [], FOTOS = DB.get('fotos',[]), REPORTS = DB.get('reports',[]);

// Sincronização dinâmica com o GitHub (apoiotecnico1.github.io/cps)
async function initData() {
  try {
    const [resKms, resRegs] = await Promise.all([
      fetch('https://apoiotecnico1.github.io/cps/data/kms.json').catch(() => null),
      fetch('https://apoiotecnico1.github.io/cps/data/regs.json').catch(() => null)
    ]);
    
    if (resKms && resKms.ok) {
      KMS = await resKms.json();
    } else {
      throw new Error('Fallback local para KMS');
    }
  } catch {
    // Fallback padrão se não carregar da Web
    KMS = [
      {id:'km1',km:10,lat:-23.550,lon:-46.633,rodovia:'BR-116'},
      {id:'km2',km:15,lat:-23.520,lon:-46.610,rodovia:'BR-116'}
    ];
  }

  try {
    if (resRegs && resRegs.ok) {
      REGS = await resRegs.json();
    } else {
      throw new Error('Fallback local para REGS');
    }
  } catch {
    REGS = DB.get('regs', [
      {id:'CPS-1001',id_no:'PT-1001',lat:-23.552,lon:-46.631,tipo:'poste',status:'pendente',observacao:'Lâmpada queimada',checklist:{}},
      {id:'CPS-1002',id_no:'CX-2042',lat:-23.518,lon:-46.608,tipo:'caixa',status:'em_andamento',observacao:'Reparo em andamento',checklist:{}}
    ]);
  }
  route();
}

function startGPS(){
  if(WATCH) return;
  if(!navigator.geolocation){ POS_ERR='não suportado'; renderTopbar(); return; }
  WATCH=navigator.geolocation.watchPosition(
    p=>{ POS={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}; POS_ERR=null; onGPS(); },
    e=>{ POS_ERR=e.code===1?'permissão negada':e.code===2?'sinal indisponível':'timeout'; renderTopbar(); },
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
}
function dist(a,b){ const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))); }
function nearest(p,arr){ if(!p || !arr.length) return null; let best=null,bd=Infinity; arr.forEach(o=>{const d=dist(p,o);if(d<bd){bd=d;best=o;}}); return best?{...best,_d:bd}:null; }
function fmtDist(m){ return m<1000?m+' m':(m/1000).toFixed(2)+' km'; }
const STATUS={pendente:{l:'Pendente',c:'#ffd74d'},em_andamento:{l:'Em andamento',c:'#3aa6ff'},resolvido:{l:'Resolvido',c:'#21c77d'},inspecionado:{l:'Inspecionado',c:'#ff9a3c'}};

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
function openDrawer(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('drawer').classList.add('on'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('on'); }

const ROUTES={
  home:{t:'Apoio Técnico',s:'Central de Operação',render:home},
  localizar:{t:'Localizar ID',s:'Encontrar registros por GPS',render:localizar},
  km:{t:'Posição KM',s:'Monitoramento rodoviário',render:km},
  inspecao:{t:'Inspeção',s:'Inspeção fotográfica',render:inspecao},
  checklist:{t:'Checklist',s:'Checklist de campo',render:checklist},
  painel:{t:'Painel do Gestor',s:'Dashboard operacional',render:painel}
};

function go(r){ location.hash='#/'+r; }

function route(){
  let r=location.hash.replace('#/','')||'home';
  if(!ROUTES[r]) r='home';
  const cfg=ROUTES[r];
  document.getElementById('topbar').innerHTML = r==='home'
    ? `<div style="flex:1"><h2>${cfg.t}</h2><p>${cfg.s}</p></div>`
    : `<button class="back" onclick="go('home')">${I.back}</button><div style="flex:1"><h2>${cfg.t}</h2><p>${cfg.s}</p></div>`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+r));
  cfg.render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function renderNav(){
  document.getElementById('nav').innerHTML=[['localizar',I.cross,'Localizar'],['km',I.pin,'KM'],['inspecao',I.cam,'Inspeção'],['checklist',I.clip,'Checklist'],['painel',I.dash,'Painel']].map(([r,i,l])=>`<a href="#/${r}">${i}<span>${l}</span></a>`).join('');
}
function renderTopbar(){ const sub=document.querySelector('.topbar p'); if(!sub) return; if(POS_ERR) sub.textContent='GPS · '+POS_ERR; else if(POS) sub.textContent=`GPS · ±${Math.round(POS.acc)} m`; }
function onGPS(){ renderTopbar(); if(location.hash.includes('km')) km(); if(location.hash.includes('localizar')) localizar(); }

function home(){
  const now=new Date();
  const gpsCls=POS_ERR||!POS?'gps-bad':POS.acc<=15?'gps-ok':POS.acc<=35?'gps-warn':'gps-bad';
  const gpsTxt=POS_ERR?('GPS · '+POS_ERR):!POS?'GPS · buscando sinal':`GPS · ±${Math.round(POS.acc)} m`;
  const mods=[['localizar',I.cross,'Localizar ID','Encontre registros por GPS'],['km',I.pin,'Posição KM','KM atual na rodovia'],['inspecao',I.cam,'Inspeção','Fotos com HUD + PDF'],['checklist',I.clip,'Checklist','Itens de verificação'],['painel',I.dash,'Painel','Dashboard do gestor']];
  document.getElementById('view').innerHTML=`
    <div class="card center"><div class="tag">CENTRAL DE OPERAÇÃO</div><div class="big mt8" style="color:var(--yellow)">${now.toLocaleTimeString('pt-BR')}</div><div class="muted mt8">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><div class="gps-box ${gpsCls} mt12">${gpsTxt}</div></div>
    <div class="grid2">${mods.map(([r,i,t,d])=>`<a class="module" href="#/${r}"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></a>`).join('')}</div>`;
}

let LMAP=null, LMARK=[], SEARCH='';
function localizar(){
  const list=REGS.filter(r=>!SEARCH||r.id_no.toLowerCase().includes(SEARCH.toLowerCase())||r.id.toLowerCase().includes(SEARCH.toLowerCase()));
  const sorted=POS?[...list].map(r=>({...r,_d:dist(POS,r)})).sort((a,b)=>a._d-b._d):list;
  document.getElementById('view').innerHTML=`
    <div class="card"><label>BUSCAR ID</label><div class="row"><input id="q" placeholder="ID do nó..." value="${SEARCH}" oninput="SEARCH=this.value;localizar()" /><button class="btn btn-ghost" onclick="SEARCH='';document.getElementById('q').value='';localizar()">${I.x}</button></div></div>
    <div class="card"><div id="map"></div></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">REGISTROS PRÓXIMOS</div><div id="rlist"></div></div>`;
  renderMap(sorted); renderRList(sorted);
}
function renderMap(list){
  if(LMAP){ LMAP.remove(); LMAP=null; }
  const c=POS?[POS.lat,POS.lon]:[-23.45,-46.58];
  LMAP=L.map('map').setView(c,13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(LMAP);
  LMARK.forEach(m=>m.remove()); LMARK=[];
  if(POS){ L.circleMarker([POS.lat,POS.lon],{radius:8,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.9}).addTo(LMAP); }
  list.forEach(r=>{ const col=STATUS[r.status]?.c||'#fff'; const m=L.circleMarker([r.lat,r.lon],{radius:7,color:col,fillColor:col,fillOpacity:.85}).addTo(LMAP); m.bindPopup(`<b>${r.id_no}</b><br><span style="font-size:11px">${STATUS[r.status]?.l||r.status}</span>`); m.on('click',()=>openReg(r.id)); LMARK.push(m); });
}
function renderRList(list){
  const el=document.getElementById('rlist');
  if(!list.length){ el.innerHTML='<div class="muted center" style="padding:20px">Nenhum registro</div>'; return; }
  el.innerHTML=list.map(r=>`<div class="list-item" onclick="openReg('${r.id}')"><div><div style="font-weight:800">${r.id_no}</div><div class="tag">${r.tipo} · ${r._d!=null?fmtDist(r._d):'—'}</div></div><span class="badge b-${r.status}">${STATUS[r.status]?.l||r.status}</span></div>`).join('');
}
function openReg(id){
  const r=REGS.find(x=>x.id===id); if(!r) return;
  openDrawer(`<div class="row" style="margin-bottom:14px"><div><div class="tag">ID DO NÓ</div><div style="font-weight:900;font-size:18px">${r.id_no}</div></div><span class="badge b-${r.status}">${STATUS[r.status]?.l||r.status}</span></div><label>STATUS</label><select id="st">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===r.status?'selected':''}>${STATUS[k].l}</option>`).join('')}</select><label class="mt12">OBSERVAÇÃO</label><textarea id="ob" rows="3">${r.observacao||''}</textarea><button class="btn btn-primary mt12" onclick="saveReg('${r.id}')">SALVAR</button><button class="btn btn-ghost mt8" onclick="closeDrawer()">FECHAR</button>`);
}
function saveReg(id){ const r=REGS.find(x=>x.id===id); r.status=document.getElementById('st').value; r.observacao=document.getElementById('ob').value; DB.set('regs',REGS); closeDrawer(); toast('Atualizado'); localizar(); }

let KMAP=null;
function km(){
  const n=POS?nearest(POS,KMS):null;
  document.getElementById('view').innerHTML=`
    <div class="card center"><div class="tag">KM ATUAL</div><div class="big" style="color:var(--yellow)">${n?'KM '+n.km:'—'}</div><div class="muted mt8">${n?n.rodovia:'aguardando GPS'}</div></div>
    <div class="card"><div id="map2"></div></div>`;
  if(KMAP){ KMAP.remove(); KMAP=null; }
  if(POS){ KMAP=L.map('map2').setView([POS.lat,POS.lon],15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(KMAP); L.circleMarker([POS.lat,POS.lon],{radius:8,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.9}).addTo(KMAP); if(n) L.marker([n.lat,n.lon]).addTo(KMAP).bindPopup('KM '+n.km); }
}

let STREAM=null, CAPTURING=false, FRAMES=[], TIMER=null, SETTINGS={interval:3,batch:6,text:''};
function inspecao(){
  const n=POS?nearest(POS,KMS):null;
  document.getElementById('view').innerHTML=`
    <div class="card"><div class="row" style="margin-bottom:10px"><div><div class="tag">KM ATUAL</div><div style="font-weight:900;color:var(--yellow)">${n?'KM '+n.km:'—'}</div></div><div style="text-align:right"><div class="tag">FOTOS</div><div style="font-weight:900">${FOTOS.length}</div></div></div></div>
    <div class="card"><div id="camArea"></div></div>
    <div class="card"><label>TEXTO NA FOTO (opcional)</label><input id="tx" value="${SETTINGS.text}" placeholder="Ex: Setor Norte" oninput="SETTINGS.text=this.value"/></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">RELATÓRIOS RECENTES</div><div id="reps"></div></div>`;
  renderCamArea(); renderReps();
}
function renderCamArea(){
  const el=document.getElementById('camArea');
  if(!STREAM){ el.innerHTML=`<button class="btn btn-primary" onclick="startCam()">${I.cam} ATIVAR CÂMERA</button>`; return; }
  el.innerHTML=`<div class="cam-wrap"><video id="vid" autoplay playsinline muted></video><canvas id="cnv" class="hidden"></canvas></div><div class="grid2 mt12">${CAPTURING?`<button class="btn btn-danger" onclick="stopBatch()">${I.stop} PARAR</button><button class="btn btn-primary" onclick="finishBatch()">${I.check} GERAR PDF</button>`:`<button class="btn btn-ghost" onclick="captureOne()">${I.cam} FOTO</button><button class="btn btn-green" onclick="startBatch()">${I.play} LOTE</button>`}</div>${FRAMES.length?`<div class="mt12"><div class="grid-photos">${FRAMES.map(f=>`<img class="photo-thumb" src="${f}"/>`).join('')}</div></div>`:''}`;
  const v = document.getElementById('vid'); if(v) v.srcObject = STREAM;
}
async function startCam(){ try{ STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); renderCamArea(); }catch(e){ toast('Erro na câmera'); } }
function drawOverlay(){
  const v=document.getElementById('vid'), c=document.getElementById('cnv'); if(!v||!v.videoWidth) return null;
  c.width=v.videoWidth; c.height=v.videoHeight; const ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  const n=nearest(POS,KMS), km=n?'KM '+n.km:'—';
  ctx.fillStyle='rgba(7,16,21,.78)'; ctx.fillRect(12,12,c.width*0.5,50);
  ctx.fillStyle='#ffd74d'; ctx.font='bold 24px sans-serif'; ctx.fillText(km,24,45);
  return c;
}
function captureOne(){ const c=drawOverlay(); if(!c){ toast('Câmera indisponível'); return; } const url=c.toDataURL('image/jpeg',.85); FOTOS.push({url,data:new Date().toISOString()}); DB.set('fotos',FOTOS); FRAMES.push(url); renderCamArea(); toast('Foto salva'); }
function startBatch(){ CAPTURING=true; FRAMES=[]; renderCamArea(); loop(); }
function loop(){ if(!CAPTURING) return; const c=drawOverlay(); if(c){ FRAMES.push(c.toDataURL('image/jpeg',.85)); renderCamArea(); } if(FRAMES.length>=SETTINGS.batch){ finishBatch(); return; } TIMER=setTimeout(loop,SETTINGS.interval*1000); }
function stopBatch(){ CAPTURING=false; clearTimeout(TIMER); renderCamArea(); }
function finishBatch(){
  CAPTURING=false; clearTimeout(TIMER); if(!FRAMES.length) return;
  const pdf=makePDF(), id=('R'+Date.now()).slice(0,6);
  REPORTS.unshift({id,data:new Date().toISOString(),fotos:FRAMES.length,pdf}); DB.set('reports',REPORTS); FRAMES=[]; renderCamArea(); renderReps(); toast('Relatório gerado');
}
function renderReps(){ 
  const el=document.getElementById('reps'); if(!el) return;
  el.innerHTML=REPORTS.length?REPORTS.map(r=>`<div class="list-item"><div><div style="font-weight:800">Relatório ${r.id}</div><div class="tag">${new Date(r.data).toLocaleString('pt-BR')} · ${r.fotos} fotos</div></div><a class="pill" href="${r.pdf}" download="relatorio-${r.id}.pdf" style="color:var(--yellow)">PDF</a></div>`).join(''):'<div class="muted center" style="padding:16px">Nenhum relatório</div>'; 
}
function makePDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'});
  doc.setFontSize(18); doc.text('Relatório de Inspeção',40,40);
  let y=70;
  FRAMES.forEach(f=>{ try{ doc.addImage(f,'JPEG',40,y,200,150); y+=170; }catch(e){} });
  return doc.output('dataurlstring');
}

const CHK_ITEMS=['EPI completo','Sinalização instalada','Acesso liberado','Equipamento testado'];
function checklist(){
  document.getElementById('view').innerHTML=`<div class="card"><div id="clist"></div></div>`;
  document.getElementById('clist').innerHTML=REGS.map(r=>`<div class="list-item" onclick="openChk('${r.id}')"><div><div style="font-weight:800">${r.id_no}</div><div class="tag">${r.tipo}</div></div><span class="badge b-${r.status}">${STATUS[r.status]?.l||r.status}</span></div>`).join('');
}
function openChk(id){
  const r=REGS.find(x=>x.id===id), cl=r.checklist||{};
  openDrawer(`<div style="font-weight:900;font-size:18px;margin-bottom:8px">${r.id_no}</div>${CHK_ITEMS.map((it,i)=>`<label class="chk"><input type="checkbox" id="c${i}" ${cl[i]?'checked':''}/><span style="font-size:13px">${it}</span></label>`).join('')}<button class="btn btn-primary mt12" onclick="saveChk('${r.id}')">Salvar</button>`);
}
function saveChk(id){ const r=REGS.find(x=>x.id===id), cl={}; CHK_ITEMS.forEach((_,i)=>cl[i]=document.getElementById('c'+i).checked); r.checklist=cl; DB.set('regs',REGS); closeDrawer(); toast('Salvo'); }

let PMAP=null;
function painel(){
  const total=REGS.length, resolvidos=REGS.filter(r=>r.status==='resolvido').length;
  document.getElementById('view').innerHTML=`
    <div class="grid2"><div class="stat"><div class="l">Total</div><div class="n">${total}</div></div><div class="stat"><div class="l">Resolvidos</div><div class="n" style="color:var(--green)">${resolvidos}</div></div></div>
    <div class="card mt12"><div style="font-weight:800;font-size:12px;margin-bottom:10px">MAPA OPERACIONAL</div><div id="map3"></div></div>`;
  if(PMAP){ PMAP.remove(); PMAP=null; }
  PMAP=L.map('map3').setView([-23.45,-46.58],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(PMAP);
  REGS.forEach(r=>{
    const col = STATUS[r.status]?.c || '#fff';
    L.circleMarker([r.lat,r.lon],{radius:6,color:col,fillColor:col,fillOpacity:.8}).addTo(PMAP);
  });
}

startGPS();
renderNav();
initData(); // Inicia efetuando o carregamento dinâmico via fetch da página do GitHub
