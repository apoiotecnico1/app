<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Apoio Campo — Central de Operação</title>
<link rel="stylesheet" href__="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#071015; --bg2:#0c1b22; --card:#0e1f27; --card2:#112732;
    --fg:#e6f1f4; --muted:#7d97a3; --border:#1c3441;
    --yellow:#ffd74d; --green:#21c77d; --red:#ff5c5c; --orange:#ff9a3c; --blue:#3aa6ff;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(circle at top,#0e2230,#071015 60%);
    color:var(--fg);overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  header.topbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:rgba(7,16,21,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  }
  .topbar .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .topbar h2{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin:0}
  .topbar p{font-size:10px;color:var(--muted);margin:0}
  main{flex:1;padding:16px;padding-bottom:84px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{padding:14px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,var(--yellow),#e8b53a);color:#071015}
  .btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .btn-danger{background:linear-gradient(135deg,#ff5c5c,#c22929);color:#fff}
  .btn-green{background:linear-gradient(135deg,var(--green),#178a5a);color:#071015}
  .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid}
  .b-pendente{color:#ffd74d;background:rgba(255,215,77,.1);border-color:rgba(255,215,77,.4)}
  .b-em_andamento{color:#3aa6ff;background:rgba(58,166,255,.1);border-color:rgba(58,166,255,.4)}
  .b-resolvido{color:#21c77d;background:rgba(33,199,125,.1);border-color:rgba(33,199,125,.4)}
  .b-inspecionado{color:#ff9a3c;background:rgba(255,154,60,.1);border-color:rgba(255,154,60,.4)}
  .gps-ok{color:#21c77d;background:rgba(33,199,125,.1);border:1px solid rgba(33,199,125,.4)}
  .gps-warn{color:#ff9a3c;background:rgba(255,154,60,.1);border:1px solid rgba(255,154,60,.4)}
  .gps-bad{color:#ff5c5c;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.4)}
  .gps-box{text-align:center;border-radius:12px;padding:12px;font-size:11px;font-weight:800}
  input,select,textarea{width:100%;background:#0a161c;border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--fg);font-size:14px;font-family:inherit}
  label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,16,21,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:10px;font-weight:800;color:var(--muted);text-decoration:none}
  nav.bottom a.on{color:var(--yellow)}
  nav.bottom svg{width:22px;height:22px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .stat .n{font-size:26px;font-weight:900}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .bar{height:10px;border-radius:6px;background:#0a161c;overflow:hidden}
  .bar>div{height:100%;border-radius:6px}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px}
  .pill{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--border);background:rgba(255,255,255,.04);text-decoration:none}
  #map,#map2,#map3{height:260px;border-radius:14px;border:1px solid var(--border)}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0e1f27;border:1px solid var(--yellow);color:var(--yellow);padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}
  .drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none}
  .drawer.on{display:block}
  .drawer .sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
  .chk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
  .chk input{width:20px;height:20px;flex:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:10px;text-transform:uppercase}
  .hidden{display:none}
  .big{font-size:40px;font-weight:900}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
  .mb8{margin-bottom:8px}
  .tag{font-size:10px;color:var(--muted)}
  .photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .grid-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .module{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--card);text-decoration:none;color:var(--fg)}
  .module .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,215,77,.12);color:var(--yellow)}
  .module h3{margin:0;font-size:14px}
  .module p{margin:0;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <nav class="bottom" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const I = {
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="6" y="6" width="12" height="12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><path d="M5 12l5 5L20 7"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6v20h12V8z"/><path d="M14 2v6h6"/></svg>'
};

const DB = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('ac_'+k)) ?? d; }catch{ return d; } },
  set(k,v){ localStorage.setItem('ac_'+k, JSON.stringify(v)); }
};
let POS=null, POS_ERR=null, WATCH=null;
let KMS=DB.get('kms',null), REGS=DB.get('regs',null), FOTOS=DB.get('fotos',[]), REPORTS=DB.get('reports',[]);

function seed(){
  if(!KMS){
    KMS=[];
    const base=[[-23.550,-46.633],[-23.520,-46.610],[-23.490,-46.585],[-23.460,-46.560],[-23.430,-46.535],[-23.400,-46.510],[-23.370,-46.485],[-23.340,-46.460],[-23.310,-46.435],[-23.280,-46.410],[-23.250,-46.385],[-23.220,-46.360]];
    base.forEach((p,i)=>KMS.push({id:'km'+(i+1),km:10+i*5,lat:p[0],lon:p[1],rodovia:'BR-116'}));
    DB.set('kms',KMS);
  }
  if(!REGS){
    REGS=[
      {id:'AC-1001',id_no:'PT-1001',lat:-23.552,lon:-46.631,tipo:'poste',status:'pendente',observacao:'Lâmpada queimada',checklist:{}},
      {id:'AC-1002',id_no:'CX-2042',lat:-23.518,lon:-46.608,tipo:'caixa',status:'em_andamento',observacao:'Reparo em andamento',checklist:{}},
      {id:'AC-1003',id_no:'RG-3078',lat:-23.488,lon:-46.583,tipo:'registro',status:'resolvido',observacao:'Válvula trocada',checklist:{}},
      {id:'AC-1004',id_no:'SV-4011',lat:-23.458,lon:-46.558,tipo:'servico',status:'inspecionado',observacao:'Inspeção concluída',checklist:{}},
      {id:'AC-1005',id_no:'PT-1055',lat:-23.428,lon:-46.533,tipo:'poste',status:'pendente',observacao:'Aguardando peça',checklist:{}},
      {id:'AC-1006',id_no:'CX-2090',lat:-23.398,lon:-46.508,tipo:'caixa',status:'em_andamento',observacao:'Conexão intermitente',checklist:{}},
      {id:'AC-1007',id_no:'RG-3120',lat:-23.368,lon:-46.483,tipo:'registro',status:'pendente',observacao:'Vazamento detectado',checklist:{}},
      {id:'AC-1008',id_no:'SV-4050',lat:-23.338,lon:-46.458,tipo:'servico',status:'resolvido',observacao:'Serviço finalizado',checklist:{}}
    ];
    DB.set('regs',REGS);
  }
}
seed();

function startGPS(){
  if(WATCH) return;
  if(!navigator.geolocation){ POS_ERR='não suportado'; renderTopbar(); return; }
  WATCH=navigator.geolocation.watchPosition(
    p=>{ POS={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}; POS_ERR=null; onGPS(); },
    e=>{ POS_ERR=errTxt(e); renderTopbar(); },
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
}
function errTxt(e){ return e.code===1?'permissão negada':e.code===2?'sinal indisponível':'timeout'; }
function dist(a,b){ const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))); }
function nearest(p,arr){ if(!p) return null; let best=null,bd=Infinity; arr.forEach(o=>{const d=dist(p,o);if(d<bd){bd=d;best=o;}}); return best?{...best,_d:bd}:null; }
function fmtDist(m){ return m<1000?m+' m':(m/1000).toFixed(2)+' km'; }
const STATUS={pendente:{l:'Pendente',c:'#ffd74d'},em_andamento:{l:'Em andamento',c:'#3aa6ff'},resolvido:{l:'Resolvido',c:'#21c77d'},inspecionado:{l:'Inspecionado',c:'#ff9a3c'}};

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
function openDrawer(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('drawer').classList.add('on'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('on'); }

const ROUTES={
  home:{t:'Apoio Campo',s:'Central de operação',render:home},
  localizar:{t:'Localizar ID',s:'Encontrar registros por GPS',render:localizar},
  km:{t:'Posição KM',s:'Monitoramento rodoviário',render:km},
  inspecao:{t:'Inspeção',s:'Inspeção fotográfica',render:inspecao},
  checklist:{t:'Checklist',s:'Checklist de campo',render:checklist},
  painel:{t:'Painel do Gestor',s:'Dashboard operacional',render:painel}
};
function go(r){ location.hash='#/'+r; }
function route(){
  let r=location.hash.replace('#/','')||'home';
  if(!ROUTES[r]) r='home';
  const cfg=ROUTES[r];
  document.getElementById('topbar').innerHTML = r==='home'
    ? `<div style="flex:1"><h2>${cfg.t}</h2><p>${cfg.s}</p></div>`
    : `<button class="back" onclick="go('home')">${I.back}</button><div style="flex:1"><h2>${cfg.t}</h2><p>${cfg.s}</p></div>`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  cfg.render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function renderNav(){
  document.getElementById('nav').innerHTML=[['localizar',I.cross,'Localizar'],['km',I.pin,'KM'],['inspecao',I.cam,'Inspeção'],['checklist',I.clip,'Checklist'],['painel',I.dash,'Painel']].map(([r,i,l])=>`<a data-r="${r}" href__="#/${r}">${i}<span>${l}</span></a>`).join('');
}
function renderTopbar(){ const sub=document.querySelector('.topbar p'); if(!sub) return; if(POS_ERR) sub.textContent='GPS · '+POS_ERR; else if(POS) sub.textContent=`GPS · ±${Math.round(POS.acc)} m`; }
function onGPS(){ renderTopbar(); if(location.hash.includes('km')) km(); if(location.hash.includes('localizar')) localizar(); }

function home(){
  const now=new Date();
  const gpsCls=POS_ERR||!POS?'gps-bad':POS.acc<=15?'gps-ok':POS.acc<=35?'gps-warn':'gps-bad';
  const gpsTxt=POS_ERR?('GPS · '+POS_ERR):!POS?'GPS · buscando sinal':`GPS · ±${Math.round(POS.acc)} m`;
  const mods=[['localizar',I.cross,'Localizar ID','Encontre registros por GPS'],['km',I.pin,'Posição KM','KM atual na rodovia'],['inspecao',I.cam,'Inspeção','Fotos com HUD + PDF'],['checklist',I.clip,'Checklist','Itens de verificação'],['painel',I.dash,'Painel','Dashboard do gestor']];
  document.getElementById('view').innerHTML=`
    <div class="card center"><div class="tag">OPERAÇÃO DE CAMPO</div><div class="big mt8" style="color:var(--yellow)">${now.toLocaleTimeString('pt-BR')}</div><div class="muted mt8">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><div class="gps-box ${gpsCls} mt12">${gpsTxt}</div></div>
    <div class="grid2">${mods.map(([r,i,t,d])=>`<a class="module" href__="#/${r}"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></a>`).join('')}</div>
    <div class="card mt12" style="display:flex;gap:10px;align-items:center;border-color:rgba(255,215,77,.3)"><div style="color:var(--yellow)">${I.shield}</div><div><div style="font-weight:800;font-size:12px">Segurança em campo</div><div class="tag">Use EPI e mantenha o aplicativo aberto para registro contínuo.</div></div></div>`;
}

let LMAP,LMARK=[],SEARCH='';
function localizar(){
  const list=REGS.filter(r=>!SEARCH||r.id_no.toLowerCase().includes(SEARCH.toLowerCase())||r.id.toLowerCase().includes(SEARCH.toLowerCase()));
  const sorted=POS?[...list].map(r=>({...r,_d:dist(POS,r)})).sort((a,b)=>a._d-b._d):list;
  document.getElementById('view').innerHTML=`
    <div class="card"><label>BUSCAR ID</label><div class="row"><input id="q" placeholder="ID do nó..." value="${SEARCH}" oninput="SEARCH=this.value;localizar()" /><button class="btn btn-ghost" onclick="SEARCH='';document.getElementById('q').value='';localizar()">${I.x}</button></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><div><div class="tag">KM MAIS PRÓXIMO</div><div style="font-weight:900;font-size:18px;color:var(--yellow)">${POS?(()=>{const n=nearest(POS,KMS);return n?'KM '+n.km:'—'})():'—'}</div></div><div style="text-align:right"><div class="tag">REGISTROS</div><div style="font-weight:900;font-size:18px">${REGS.length}</div></div></div><div id="map"></div></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">PRÓXIMOS</div><div id="rlist"></div></div>`;
  renderMap(sorted); renderRList(sorted);
}
function renderMap(list){
  if(LMAP){ LMAP.remove(); LMAP=null; }
  const c=POS?[POS.lat,POS.lon]:[-23.45,-46.58];
  LMAP=L.map('map').setView(c,13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(LMAP);
  LMARK.forEach(m=>m.remove()); LMARK=[];
  if(POS){ L.circleMarker([POS.lat,POS.lon],{radius:8,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.9}).addTo(LMAP); L.circle([POS.lat,POS.lon],{radius:POS.acc||15,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.08}).addTo(LMAP); }
  list.slice(0,40).forEach(r=>{ const col=STATUS[r.status].c; const m=L.circleMarker([r.lat,r.lon],{radius:7,color:col,fillColor:col,fillOpacity:.85}).addTo(LMAP); m.bindPopup(`<b>${r.id_no}</b><br><span style="font-size:11px">${STATUS[r.status].l}</span>`); m.on('click',()=>openReg(r.id)); LMARK.push(m); });
}
function renderRList(list){
  const el=document.getElementById('rlist');
  if(!list.length){ el.innerHTML='<div class="muted center" style="padding:20px">Nenhum registro</div>'; return; }
  el.innerHTML=list.slice(0,30).map(r=>`<div class="list-item" onclick="openReg('${r.id}')"><div><div style="font-weight:800">${r.id_no}</div><div class="tag">${r.tipo} · ${r._d!=null?fmtDist(r._d):'—'}</div></div><span class="badge b-${r.status}">${STATUS[r.status].l}</span></div>`).join('');
}
function openReg(id){
  const r=REGS.find(x=>x.id===id); if(!r) return; const d=POS?dist(POS,r):null;
  openDrawer(`<div class="row" style="margin-bottom:14px"><div><div class="tag">ID DO NÓ</div><div style="font-weight:900;font-size:18px">${r.id_no}</div></div><span class="badge b-${r.status}">${STATUS[r.status].l}</span></div><div class="grid2 mb8"><div><div class="tag">TIPO</div><div>${r.tipo}</div></div><div><div class="tag">DISTÂNCIA</div><div>${d!=null?fmtDist(d):'—'}</div></div></div><div class="mb8"><div class="tag">COORDENADAS</div><div>${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}</div></div><div class="mb8"><div class="tag">OBSERVAÇÃO</div><div>${r.observacao||'—'}</div></div><label class="mt12">STATUS</label><select id="st">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===r.status?'selected':''}>${STATUS[k].l}</option>`).join('')}</select><label class="mt12">OBSERVAÇÃO</label><textarea id="ob" rows="3">${r.observacao||''}</textarea><button class="btn btn-primary mt12" onclick="saveReg('${r.id}')">SALVAR ALTERAÇÕES</button><button class="btn btn-green mt8" onclick="shareWA('${r.id}')">${I.send} COMPARTILHAR NO WHATSAPP</button><button class="btn btn-ghost mt8" onclick="closeDrawer()">FECHAR</button>`);
}
function saveReg(id){ const r=REGS.find(x=>x.id===id); r.status=document.getElementById('st').value; r.observacao=document.getElementById('ob').value; DB.set('regs',REGS); closeDrawer(); toast('Registro atualizado'); localizar(); }
function shareWA(id){ const r=REGS.find(x=>x.id===id); const d=POS?dist(POS,r):null; const txt=`*Apoio Campo*%0AID: ${r.id_no}%0ATipo: ${r.tipo}%0AStatus: ${STATUS[r.status].l}%0A${d!=null?'Distância: '+fmtDist(d)+'%0A':''}Coords: ${r.lat.toFixed(5)},${r.lon.toFixed(5)}%0AObs: ${r.observacao||'-'}`; window.open('https://wa.me/?text='+txt,'_blank'); }

let KMAP;
function km(){
  const n=POS?nearest(POS,KMS):null;
  document.getElementById('view').innerHTML=`
    <div class="card center"><div class="tag">KM ATUAL</div><div class="big" style="color:var(--yellow)">${n?'KM '+n.km:'—'}</div><div class="muted mt8">${n?n.rodovia:'aguardando GPS'}</div></div>
    <div class="grid2"><div class="card center"><div class="tag">LATITUDE</div><div style="font-weight:800">${POS?POS.lat.toFixed(5):'—'}</div></div><div class="card center"><div class="tag">LONGITUDE</div><div style="font-weight:800">${POS?POS.lon.toFixed(5):'—'}</div></div></div>
    <div class="card"><div class="gps-box ${POS_ERR||!POS?'gps-bad':POS.acc<=15?'gps-ok':POS.acc<=35?'gps-warn':'gps-bad'}">${POS_ERR?('GPS · '+POS_ERR):!POS?'GPS · buscando sinal':`GPS · ±${Math.round(POS.acc)} m de precisão`}</div></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">MAPA DE REFERÊNCIA</div><div id="map2"></div></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:8px">DICA DE PRECISÃO</div><div class="tag">Mantenha o celular ao ar livre, longe de obstáculos. Alta precisão ativa ±15 m.</div></div>`;
  if(KMAP){ KMAP.remove(); KMAP=null; }
  if(POS){ KMAP=L.map('map2').setView([POS.lat,POS.lon],15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(KMAP); L.circleMarker([POS.lat,POS.lon],{radius:8,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.9}).addTo(KMAP); L.circle([POS.lat,POS.lon],{radius:POS.acc||15,color:'#21c77d',fillColor:'#21c77d',fillOpacity:.08}).addTo(KMAP); if(n) L.marker([n.lat,n.lon]).addTo(KMAP).bindPopup('KM '+n.km); }
}

let STREAM=null, CAPTURING=false, FRAMES=[], TIMER=null, SETTINGS={interval:3,batch:6,text:''}, STARTKM='—';
function inspecao(){
  const n=POS?nearest(POS,KMS):null;
  document.getElementById('view').innerHTML=`
    <div class="card"><div class="row" style="margin-bottom:10px"><div><div class="tag">KM ATUAL</div><div style="font-weight:900;color:var(--yellow)">${n?'KM '+n.km:'—'}</div></div><div style="text-align:right"><div class="tag">FOTOS</div><div style="font-weight:900">${FOTOS.length}</div></div></div><div class="gps-box ${POS_ERR||!POS?'gps-bad':POS.acc<=15?'gps-ok':'gps-warn'}">${POS_ERR?('GPS · '+POS_ERR):!POS?'GPS · buscando':`GPS · ±${Math.round(POS.acc)} m`}</div></div>
    <div class="card"><div id="camArea"></div></div>
    <div class="card"><label>CONFIGURAÇÃO DO LOTE</label><div class="grid2"><div><label>INTERVALO (s)</label><input type="number" id="iv" value="${SETTINGS.interval}" min="1" max="30" onchange="SETTINGS.interval=+this.value"/></div><div><label>QTD FOTOS</label><input type="number" id="bt" value="${SETTINGS.batch}" min="1" max="30" onchange="SETTINGS.batch=+this.value"/></div></div><label class="mt12">TEXTO NA FOTO (opcional)</label><input id="tx" value="${SETTINGS.text}" placeholder="Ex: Setor Norte" oninput="SETTINGS.text=this.value"/></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">RELATÓRIOS RECENTES</div><div id="reps"></div></div>`;
  renderCamArea(); renderReps();
}
function renderCamArea(){
  const el=document.getElementById('camArea');
  if(!STREAM){ el.innerHTML=`<button class="btn btn-primary" onclick="startCam()">${I.cam} ATIVAR CÂMERA</button>`; return; }
  el.innerHTML=`<div class="cam-wrap"><video id="vid" autoplay playsinline muted></video><canvas id="cnv" class="hidden"></canvas></div><div class="grid2 mt12">${CAPTURING?`<button class="btn btn-danger" onclick="stopBatch()">${I.stop} PARAR LOTE</button><button class="btn btn-primary" onclick="finishBatch()">${I.check} FINALIZAR</button>`:`<button class="btn btn-ghost" onclick="captureOne()">${I.cam} FOTO</button><button class="btn btn-green" onclick="startBatch()">${I.play} LOTE (${SETTINGS.batch})</button>`}</div>${CAPTURING?`<div class="center mt12"><div class="tag">CAPTURANDO</div><div class="big" style="color:var(--yellow)">${FRAMES.length}/${SETTINGS.batch}</div></div>`:''}${FRAMES.length?`<div class="mt12"><div class="grid-photos">${FRAMES.map(f=>`<img class="photo-thumb" src="${f}"/>`).join('')}</div></div>`:''}`;
  document.getElementById('vid').srcObject=STREAM;
}
function renderReps(){ const el=document.getElementById('reps'); el.innerHTML=REPORTS.length?REPORTS.slice(0,5).map(r=>`<div class="list-item"><div><div style="font-weight:800">${I.file} Relatório ${r.id}</div><div class="tag">${new Date(r.data).toLocaleString('pt-BR')} · ${r.fotos} fotos · ${r.km_inicial}→${r.km_final}</div></div><a class="pill" href__="${r.pdf}" download="relatorio-${r.id}.pdf" style="color:var(--yellow)">PDF</a></div>`).join(''):'<div class="muted center" style="padding:16px">Nenhum relatório</div>'; }
async function startCam(){ try{ STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); renderCamArea(); }catch(e){ toast('Câmera: '+e.message); } }
function drawOverlay(){
  const v=document.getElementById('vid'), c=document.getElementById('cnv'); if(!v||!v.videoWidth) return null;
  c.width=v.videoWidth; c.height=v.videoHeight; const ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  const n=POS?nearest(POS,KMS):null, km=n?'KM '+n.km:'—', lat=POS?POS.lat.toFixed(5):'—', lon=POS?POS.lon.toFixed(5):'—', acc=POS?'±'+Math.round(POS.acc)+'m':'—', dt=new Date().toLocaleString('pt-BR');
  const pad=12,h=64;
  ctx.fillStyle='rgba(7,16,21,.78)'; ctx.fillRect(pad,pad,c.width*0.55,h);
  ctx.fillStyle='#ffd74d'; ctx.font='bold 26px sans-serif'; ctx.fillText(km,pad+12,pad+30);
  ctx.fillStyle='#e6f1f4'; ctx.font='16px sans-serif'; ctx.fillText(`${lat}, ${lon}`,pad+12,pad+52);
  ctx.fillStyle='rgba(7,16,21,.78)'; ctx.fillRect(c.width-c.width*0.4-pad,pad,c.width*0.4,h);
  ctx.fillStyle='#21c77d'; ctx.font='bold 16px sans-serif'; ctx.fillText(acc,c.width-c.width*0.4-pad+12,pad+24);
  ctx.fillStyle='#e6f1f4'; ctx.font='14px sans-serif'; ctx.fillText(dt,c.width-c.width*0.4-pad+12,pad+48);
  if(SETTINGS.text){ ctx.fillStyle='rgba(7,16,21,.78)'; ctx.fillRect(pad,c.height-50,c.width-pad*2,38); ctx.fillStyle='#ffd74d'; ctx.font='bold 20px sans-serif'; ctx.fillText(SETTINGS.text,pad+12,c.height-22); }
  return c;
}
function captureOne(){ const c=drawOverlay(); if(!c){ toast('Câmera não pronta'); return; } const url=c.toDataURL('image/jpeg',.85); FOTOS.push({url,km:nearest(POS,KMS)?.km,lat:POS?.lat,lon:POS?.lon,data:new Date().toISOString(),tipo:'manual'}); DB.set('fotos',FOTOS); FRAMES.push(url); renderCamArea(); toast('Foto capturada'); }
function startBatch(){ CAPTURING=true; FRAMES=[]; STARTKM=nearest(POS,KMS)?.km||'—'; renderCamArea(); loop(); }
function loop(){ if(!CAPTURING) return; const c=drawOverlay(); if(c){ const url=c.toDataURL('image/jpeg',.85); FRAMES.push(url); FOTOS.push({url,km:nearest(POS,KMS)?.km,lat:POS?.lat,lon:POS?.lon,data:new Date().toISOString(),tipo:'lote'}); DB.set('fotos',FOTOS); renderCamArea(); } if(FRAMES.length>=SETTINGS.batch){ finishBatch(); return; } TIMER=setTimeout(loop,Math.max(800,SETTINGS.interval*1000)); }
function stopBatch(){ CAPTURING=false; clearTimeout(TIMER); renderCamArea(); }
function finishBatch(){
  CAPTURING=false; clearTimeout(TIMER); if(!FRAMES.length){ toast('Nenhuma foto'); renderCamArea(); return; }
  const endKm=nearest(POS,KMS)?.km||'—', pdf=makePDF(), id=('R'+Date.now()).slice(0,10);
  REPORTS.unshift({id,data:new Date().toISOString(),fotos:FRAMES.length,km_inicial:String(STARTKM),km_final:String(endKm),pdf}); DB.set('reports',REPORTS); FRAMES=[]; renderCamArea(); renderReps(); toast('Relatório gerado');
}
function makePDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'}); const W=doc.internal.pageSize.getWidth(); let y=40;
  doc.setFontSize(20); doc.setTextColor(7,16,21); doc.text('Relatório de Inspeção',40,y); y+=24;
  doc.setFontSize(10); doc.setTextColor(80); doc.text('Apoio Campo · '+new Date().toLocaleString('pt-BR'),40,y); y+=14;
  doc.text(`KM: ${STARTKM} → ${nearest(POS,KMS)?.km||'—'}   |   Operador: Campo   |   Fotos: ${FRAMES.length}`,40,y); y+=20;
  const cw=(W-80)/2, ch=cw*0.75;
  FRAMES.forEach((f,i)=>{ if(y+ch+30>doc.internal.pageSize.getHeight()-40){ doc.addPage(); y=40; } try{ doc.addImage(f,'JPEG',40,y,cw,ch); }catch(e){} });
  return doc.output('dataurlstring');
}

const CHK_ITEMS=['EPI completo','Sinalização instalada','Acesso liberado','Material disponível','Condição climática OK','Comunicação com base','Equipamento testado','Área isolada'];
function checklist(){
  const sorted=POS?[...REGS].map(r=>({...r,_d:dist(POS,r)})).sort((a,b)=>a._d-b._d):REGS;
  document.getElementById('view').innerHTML=`<div class="card"><div class="row"><div><div class="tag">REGISTROS</div><div style="font-weight:900">${REGS.length}</div></div><div style="text-align:right"><div class="tag">GPS</div><div style="font-weight:900;color:${POS?'var(--green)':'var(--red)'}">${POS?'ativo':'off'}</div></div></div></div><div class="card"><div id="clist"></div></div>`;
  const el=document.getElementById('clist');
  el.innerHTML=sorted.length?sorted.map(r=>`<div class="list-item" onclick="openChk('${r.id}')"><div><div style="font-weight:800">${r.id_no}</div><div class="tag">${r.tipo}${r._d!=null?' · '+fmtDist(r._d):''}</div></div><span class="badge b-${r.status}">${STATUS[r.status].l}</span></div>`).join(''):'<div class="muted center" style="padding:20px">Nenhum registro</div>';
}
function openChk(id){
  const r=REGS.find(x=>x.id===id); if(!r) return; const cl=r.checklist||{};
  openDrawer(`<div style="font-weight:900;font-size:18px;margin-bottom:4px">${r.id_no}</div><div class="tag mb8">${r.tipo} · ${STATUS[r.status].l}</div><label class="mt12">ITENS DE VERIFICAÇÃO</label>${CHK_ITEMS.map((it,i)=>`<label class="chk"><input type="checkbox" id="c${i}" ${cl[i]?'checked':''}/><span style="font-size:13px">${it}</span></label>`).join('')}<label class="mt12">STATUS</label><select id="cs">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===r.status?'selected':''}>${STATUS[k].l}</option>`).join('')}</select><label class="mt12">OBSERVAÇÃO</label><textarea id="co" rows="3">${r.observacao||''}</textarea><button class="btn btn-primary mt12" onclick="saveChk('${r.id}')">SALVAR CHECKLIST</button><button class="btn btn-ghost mt8" onclick="closeDrawer()">FECHAR</button>`);
}
function saveChk(id){ const r=REGS.find(x=>x.id===id); const cl={}; CHK_ITEMS.forEach((_,i)=>cl[i]=document.getElementById('c'+i).checked); r.checklist=cl; r.status=document.getElementById('cs').value; r.observacao=document.getElementById('co').value; DB.set('regs',REGS); closeDrawer(); toast('Checklist salvo'); checklist(); }

let PMAP;
function painel(){
  const st={}; REGS.forEach(r=>st[r.status]=(st[r.status]||0)+1); const total=REGS.length; const pct=k=>total?Math.round((st[k]||0)/total*100):0;
  document.getElementById('view').innerHTML=`
    <div class="grid2"><div class="stat"><div class="l">Registros</div><div class="n">${total}</div></div><div class="stat"><div class="l">Fotos</div><div class="n">${FOTOS.length}</div></div><div class="stat"><div class="l">Relatórios</div><div class="n">${REPORTS.length}</div></div><div class="stat"><div class="l">Resolvidos</div><div class="n" style="color:var(--green)">${st.resolvido||0}</div></div></div>
    <div class="card mt12"><div style="font-weight:800;font-size:12px;margin-bottom:12px">DISTRIBUIÇÃO POR STATUS</div>${Object.keys(STATUS).map(k=>`<div class="row" style="margin-bottom:8px"><span style="flex:0 0 110px;font-size:12px;font-weight:700">${STATUS[k].l}</span><div class="bar"><div style="width:${pct(k)}%;background:${STATUS[k].c}"></div></div><span style="flex:0 0 40px;text-align:right;font-size:12px">${st[k]||0}</span></div>`).join('')}</div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">MAPA CONSOLIDADO</div><div id="map3"></div></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">REGISTROS</div><table><thead><tr><th>ID</th><th>Tipo</th><th>Status</th><th>Coords</th></tr></thead><tbody>${REGS.map(r=>`<tr><td style="font-weight:800">${r.id_no}</td><td>${r.tipo}</td><td><span class="badge b-${r.status}">${STATUS[r.status].l}</span></td><td class="tag">${r.lat.toFixed(3)},${r.lon.toFixed(3)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><div style="font-weight:800;font-size:12px;margin-bottom:10px">RELATÓRIOS</div><div id="preps"></div></div>`;
  if(PMAP){ PMAP.remove(); PMAP=null; }
  PMAP=L.map('map3').setView([-23.45,-46.58],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(PMAP);
  REGS.forEach(r=>{ const col=STATUS[r.status].c; L.circleMarker([r.lat,r.lon],{radius:6,color:col,fillColor:col,fillOpacity:.85}).addTo(PMAP).bindPopup(r.id_no); });
  document.getElementById('preps').innerHTML=REPORTS.length?REPORTS.map(r=>`<div class="list-item"><div><div style="font-weight:800">Relatório ${r.id}</div><div class="tag">${new Date(r.data).toLocaleString('pt-BR')} · ${r.fotos} fotos</div></div><a class="pill" href__="${r.pdf}" download style="color:var(--yellow)">PDF</a></div>`).join(''):'<div class="muted center" style="padding:16px">Nenhum relatório</div>';
}

renderNav(); startGPS(); route();
document.getElementById('drawer').addEventListener('click',e=>{ if(e.target.id==='drawer') closeDrawer(); });
</script>
</body>
