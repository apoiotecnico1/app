<title>Nox OS — Sistema de Apoio & Inspeção</title>

<style>
  /* ====== Estilos Gerais ====== */
  :root {
    --bg: #06070a;
    --bg2: #0a0d11;
    --surface: #0f1216;
    --surface2: #14181d;
    --surface3: #1a1f25;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --border3: rgba(255,255,255,0.16);
    --accent: #ffd600;
    --accent2: #ffe44d;
    --accent3: #c8a800;
    --accent-dim: rgba(255, 214, 0, 0.06);
    --accent-glow: rgba(255, 214, 0, 0.15);
    --green: #10b981;
    --green2: #34d399;
    --green3: #059669;
    --green-dim: rgba(16,185,129,0.08);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.08);
    --warn: #f59e0b;
    --warn-dim: rgba(245,158,11,0.08);
    --text: #f0f0f2;
    --text2: #d4d4d8;
    --text3: #a1a1aa;
    --muted: #71717a;
    --dim: #3f3f46;
    --dimmer: #27272a;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --r-xs: 8px;
    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 20px;
    --r-xl: 24px;
    --r-2xl: 28px;
    --shadow-xs: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
    --shadow-xl: 0 24px 80px rgba(0,0,0,0.7);
    --safe-b: max(env(safe-area-inset-bottom, 0px), 20px);
    --safe-t: env(safe-area-inset-top, 0px);
    --ease: cubic-bezier(.4, 0, .2, 1);
    --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
    --ease-out: cubic-bezier(0,0,.2,1);
    --glass: rgba(255,255,255,0.03);
    --glass2: rgba(255,255,255,0.05);
    --glass3: rgba(255,255,255,0.08);
  }

  /* Reset básico e estilos globais */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html {
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior: none;
  }

  /* Estilos para botões, inputs e imagens */
  button {
    font-family: var(--font);
    cursor: pointer;
    border: 0;
    background: none;
    color: inherit;
    -webkit-user-select: none;
    user-select: none;
  }
  input, select {
    font-family: var(--font);
    outline: none;
  }
  img, video {
    display: block;
    max-width: 100%;
  }

  /* Scrollbar personalizada */
  ::-webkit-scrollbar {
    width: 3px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--dim);
    border-radius: 9px;
  }

  /* Seleção de texto */
  ::selection {
    background: rgba(255, 214, 0, 0.25);
    color: #fff;
  }

  /* ====== Splash ====== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    overflow: hidden;
  }
  #splash.done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  /* Animações e efeitos visuais do splash */
  /* ... (mantém o seu CSS existente para splash) ... */

  /* ====== Menu ====== */
  #main-menu {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 20px;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* Componentes internos do menu */
  /* ... (mantém o seu CSS existente para menu) ... */

  /* ====== Módulos ====== */
  .module {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
  }
  .module.active {
    display: block;
    animation: modFade 0.25s var(--ease);
  }
  @keyframes modFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== Cabeçalhos ====== */
  .hdr {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
    background: rgba(6, 7, 10, 0.82);
    backdrop-filter: blur(28px) saturate(1.4);
    padding: 0 16px;
    padding-top: var(--safe-t);
  }
  /* Outros estilos de cabeçalhos */
  /* ... (mantém o seu CSS existente para cabeçalhos) ... */

  /* ====== Outros componentes (wrap, cartões, botões, etc.) ====== */
  /* Mantém seus estilos existentes */
  /* ... (conserva o CSS original para esses componentes) ... */

  /* Responsividade e acessibilidade */
  /* ... (mantém os seus media queries e foco visível) ... */
</style>
</head>
