<!DOCTYPE html>

<head>
<meta charset="utf-8" />

<!-- Inclua a biblioteca jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#06070a;
  --bg2:#0a0d11;
  --surface:#0f1216;
  --surface2:#14181d;
  --surface3:#1a1f25;
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.1);
  --border3:rgba(255,255,255,.16);
  --accent:#ffd600;
  --accent2:#ffe44d;
  --accent3:#c8a800;
  --accent-dim:rgba(255,214,0,.06);
  --accent-glow:rgba(255,214,0,.15);
  --green:#10b981;
  --green2:#34d399;
  --green3:#059669;
  --green-dim:rgba(16,185,129,.08);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,.08);
  --warn:#f59e0b;
  --warn-dim:rgba(245,158,11,.08);
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,.08);
  --purple:#8b5cf6;
  --purple-dim:rgba(139,92,246,.08);
  --text:#f0f0f2;
  --text2:#d4d4d8;
  --text3:#a1a1aa;
  --muted:#71717a;
  --dim:#3f3f46;
  --dimmer:#27272a;
  --font:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-2xl:28px;
  --shadow-xs:0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --shadow-xl:0 24px 80px rgba(0,0,0,.7);
  --safe-b:max(env(safe-area-inset-bottom,0px),20px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --glass:rgba(255,255,255,.03);
  --glass2:rgba(255,255,255,.05);
  --glass3:rgba(255,255,255,.08);
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
button {
  font-family: var(--font);
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
  -webkit-user-select: none;
  user-select: none;
}
input, select {
  font-family: var(--font);
  outline: none;
}
img, video {
  display: block;
  max-width: 100%;
}
/* Scrollbar styling */
::-webkit-scrollbar {
  width: 3px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--dim);
  border-radius: 9px;
}
::selection {
  background: rgba(255,214,0,.25);
  color: #fff;
}
/* Splash Screen */
#splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  overflow: hidden;
}
#splash.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .5s ease, visibility .5s ease;
}
