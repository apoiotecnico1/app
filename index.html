<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPS OS v2 - Sistema de Apoio & Inspeção</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ffd600;
      --text-color: #e0e0e0;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: var(--accent); }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; font-size: 1rem; margin-bottom: 10px; }
    button { background: var(--accent); color: #121212; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 5px; }
    button:active { opacity: 0.8; }
    .canvas-container { position: relative; width: 100%; text-align: center; margin-top: 10px; }
    canvas { max-width: 100%; height: auto; border: 1px solid var(--border-color); border-radius: 4px; background: #000; }
    .status { font-size: 0.85rem; color: var(--accent); margin-top: 5px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>CPS OS v2</h1>
    <p style="font-size: 0.85rem; color: var(--text-muted);">Sistema de Apoio & Inspeção de Campo</p>
  </header>

  <div class="container">
    
    <!-- Configuração e Etiqueta -->
    <div class="card">
      <label for="fotoLabel">Etiqueta de Registo / Ativo:</label>
      <input type="text" id="fotoLabel" placeholder="Ex: Luminária #45 ou Setor B" oninput="syncFotoLabel(this.value)">
      
      <label for="fotoLabelLive">Pesquisa / Registo Manual:</label>
      <input type="text" id="fotoLabelLive" placeholder="Insira dados para otimizar memória..." oninput="syncFotoLabel(this.value)">
      
      <button onclick="saveData()">Guardar no Armazenamento Local</button>
      <div id="saveStatus" class="status"></div>
    </div>

    <!-- Módulo de Imagem / Canvas -->
    <div class="card">
      <label>Captura / Pré-visualização com Overlay:</label>
      <input type="file" id="imageLoader" accept="image/*" style="margin-bottom: 10px; color: #fff;">
      
      <div class="canvas-container">
        <canvas id="imageCanvas"></canvas>
      </div>
      <button onclick="processCanvasImage()">Processar e Aplicar Sobreposição</button>
    </div>

  </div>

  <script>
    // Gestão de Estado Local e Sincronização de Etiquetas
    window._fotoLabel = '';

    window.onload = function() {
      const savedLabel = localStorage.getItem('cps_os_label');
      if(savedLabel) {
        syncFotoLabel(savedLabel);
      }
    };

    function syncFotoLabel(val){
      window._fotoLabel = val;
      const liveInput = document.getElementById('fotoLabelLive');
      const gateInput = document.getElementById('fotoLabel');
      if(liveInput && liveInput.value !== val) liveInput.value = val;
      if(gateInput && gateInput.value !== val) gateInput.value = val;
    }

    function saveData() {
      const val = window._fotoLabel;
      localStorage.setItem('cps_os_label', val);
      const status = document.getElementById('saveStatus');
      status.innerText = 'Dados guardados com sucesso!';
      setTimeout(() => { status.innerText = ''; }, 3000);
    }

    // Manipulação do Canvas e Overlay Otimizado
    const imageLoader = document.getElementById('imageLoader');
    imageLoader.addEventListener('change', handleImage, false);

    function handleImage(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('imageCanvas');
          const ctx = canvas.getContext('2d');
          
          // Limitação de resolução para prevenir erros de memória em dispositivos móveis
          const MAX_WIDTH = 1280;
          let width = img.width;
          let height = img.height;
          
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          
          canvas.width = width;
          canvas.height = height;
          
          ctx.drawImage(img, 0, 0, width, height);
          drawOverlay(ctx, width, height);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    function processCanvasImage() {
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      if(canvas.width === 0 || canvas.height === 0) {
        alert('Por favor, selecione uma imagem primeiro.');
        return;
      }
      // Redesenha para garantir o overlay atualizado
      drawOverlay(ctx, canvas.width, canvas.height);
      document.getElementById('saveStatus').innerText = 'Overlay aplicado com sucesso!';
      setTimeout(() => { document.getElementById('saveStatus').innerText = ''; }, 3000);
    }

    function drawOverlay(ctx, w, h) {
      const bh = Math.round(h * 0.15);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, h - bh, w, bh);

      const lbl = (window._fotoLabel || '').trim();
      if(lbl){
        const fs = Math.max(18, Math.round(h * 0.028));
        ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
        ctx.fillStyle = 'rgba(255, 214, 0, 0.95)';
        ctx.fillText('ETIQUETA: ' + lbl, 20, h - bh * 0.35);
      }
    }
  </script>
</body>
</html>
