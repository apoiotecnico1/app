<style>
:root {
  --bg: #050816;
  --text: #f3f4f6;
  --violet: #5b21ff;
  --green: #10b981;
  --dim: rgba(53, 53, 69, 0.8);
  --highlight: #ffd600;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 0;
}
#main-menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  padding: 20px;
  justify-items: center;
}
.menu-item {
  width: 100%;
  max-width: 240px;
  padding: 16px;
  border-radius: 12px;
  background: var(--dim);
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
.menu-item:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 12px rgba(20, 20, 20, 0.3);
}
.menu-item h3 {
  margin: 10px 0;
  font-size: 16px;
  text-transform: uppercase;
}
.menu-item p {
  font-size: 12px;
  color: var(--text);
  opacity: 0.75;
}
.menu-item svg {
  width: 48px;
  height: 48px;
  fill: var(--violet);
}

/* Module Layout */
.module {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  box-sizing: border-box;
}
.module.active {
  display: block;
}
.module header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--dim);
}
.module header h1 {
  font-size: 20px;
  text-transform: uppercase;
}
.module header button {
  background: var(--violet);
  border: none;
  color: #fff;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
}
.module .content {
  margin-top: 20px;
}
button.primary {
  margin-top: 16px;
  padding: 12px;
  background-color: var(--violet);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
button.primary:hover {
  background-color: var(--highlight);
}
</style>
</head>
