<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPS OS v2 - Apoio & Inspeção</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--primary);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #334155;
            color: var(--text-muted);
        }

        .status-badge.online {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            padding-bottom: var(--safe-bottom);
        }

        .card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-color);
            border-left: 3px solid var(--primary);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: var(--primary-dark);
        }

        .resultado-box {
            margin-top: 10px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 0.85rem;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            gap: 10px;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Tela de Carregamento Inicial -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="font-size: 0.9rem; color: var(--text-muted);">Carregando dados do Google Sheets...</p>
    </div>

    <header>
        <h1>⚡ CPS OS v2</h1>
        <div id="syncStatus" class="status-badge">Sincronizando...</div>
    </header>

    <div class="container">
        <!-- Módulo 1: Localizador de Ativos / Postes -->
        <div class="card">
            <h2>Apoio de Localização</h2>
            <div class="form-group">
                <label for="buscaInput">Buscar por ID, OS ou KM:</label>
                <input type="text" id="buscaInput" placeholder="Ex: P-102 ou 45.5" oninput="filtrarDados()">
            </div>
            <div id="resultadoBusca" class="resultado-box">Digite para iniciar a busca na base...</div>
        </div>

        <!-- Módulo 2: KM em Tempo Real & Status -->
        <div class="card">
            <h2>Monitoramento e Coordenadas</h2>
            <div style="font-size: 0.85rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px;">
                <div>📍 Base de Dados: <span id="totalRegistros" style="color: var(--text-color);">0</span> itens carregados</div>
                <div>🕒 Sincronização: <span id="ultimaSinc" style="color: var(--text-color);">Nunca</span></div>
            </div>
            <button style="margin-top: 12px;" onclick="forcarAtualizacao()">🔄 Atualizar Planilha Agora</button>
        </div>
    </div>

    <script>
        // URL do seu Google Apps Script atualizada
        const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwApzUG_khQcS4fdEHkQCaEcgiJ0Qtik8D4ZXxCayeeOHSOITv6mpjnslFnAVDjN4Uc2A/exec';
        const CACHE_KEY = 'cps_os_sheets_data_v3';
        const CACHE_TIME_KEY = 'cps_os_sheets_time_v3';

        let baseDeDados = [];

        window.addEventListener('DOMContentLoaded', () => {
            inicializarSistema();
        });

        async function inicializarSistema() {
            // 1. Tenta carregar do cache local imediatamente para zero delay
            const dadosCache = localStorage.getItem(CACHE_KEY);
            const tempoCache = localStorage.getItem(CACHE_TIME_KEY);

            if (dadosCache) {
                baseDeDados = JSON.parse(dadosCache);
                atualizarInterface(baseDeDados);
                esconderLoading();
                document.getElementById('syncStatus').innerText = 'Modo Cache (Pronto)';
                if (tempoCache) document.getElementById('ultimaSinc').innerText = new Date(Number(tempoCache)).toLocaleTimeString();
            }

            // 2. Busca dados atualizados da API do Google em segundo plano
            await baixarDadosDoGoogleSheets(!dadosCache);
        }

        async function baixarDadosDoGoogleSheets(mostrarErroObrigatorio = false) {
            try {
                const response = await fetch(SHEET_API_URL);
                if (!response.ok) throw new Error('Erro na requisição');
                
                const json = await response.json();
                
                // Trata o formato do retorno da planilha
                baseDeDados = Array.isArray(json) ? json : (json.dados || json.rows || []);

                // Salva no cache local
                localStorage.setItem(CACHE_KEY, JSON.stringify(baseDeDados));
                localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

                atualizarInterface(baseDeDados);
                esconderLoading();
                
                document.getElementById('syncStatus').innerText = 'Online (Sincronizado)';
                document.getElementById('syncStatus').classList.add('online');
                document.getElementById('ultimaSinc').innerText = new Date().toLocaleTimeString();

            } catch (error) {
                console.error("Erro ao sincronizar com Google Sheets:", error);
                if (mostrarErroObrigatorio && baseDeDados.length === 0) {
                    document.getElementById('loadingText').innerText = 'Erro ao carregar. Verifique a conexão.';
                    setTimeout(esconderLoading, 2000);
                } else {
                    document.getElementById('syncStatus').innerText = 'Modo Offline';
                }
            }
        }

        function atualizarInterface(dados) {
            document.getElementById('totalRegistros').innerText = dados.length;
        }

        function filtrarDados() {
            const termo = document.getElementById('buscaInput').value.toLowerCase().trim();
            const containerRes = document.getElementById('resultadoBusca');

            if (!termo || termo.length < 2) {
                containerRes.innerHTML = 'Digite ao menos 2 caracteres para buscar...';
                return;
            }

            // Filtro dinâmico na base de dados carregada
            const resultados = baseDeDados.filter(item => {
                return Object.values(item).some(val => 
                    String(val).toLowerCase().includes(termo)
                );
            }).slice(0, 15);

            if (resultados.length === 0) {
                containerRes.innerHTML = 'Nenhum registro encontrado.';
                return;
            }

            let html = '';
            resultados.forEach((item) => {
                let textoItem = Object.entries(item)
                    .map(([k, v]) => `<b>${k}:</b> ${v}`)
                    .join(' | ');
                html += `<div style="padding: 6px 0; border-bottom: 1px solid #334155;">${textoItem}</div>`;
            });

            containerRes.innerHTML = html;
        }

        function forcarAtualizacao() {
            document.getElementById('loadingText').innerText = 'Atualizando planilha do Google...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            baixarDadosDoGoogleSheets(true);
        }

        function esconderLoading() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }
    </script>
</body>
</html>
