<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<script>
/* ====================================================================
   CPS OS v2 — Sistema de Apoio & Inspeção
   ==================================================================== */
/* ===== UTILITIES ===== */
const ACC_G=15,ACC_Y=35;
const norm=s=>String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_ ]+/g,' ').replace(/\s+/g,' ');
const parsePt=v=>{const s=String(v??'').trim();return/,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 12742000*Math.asin(Math.sqrt(x))};
const range=(dist,acc=0)=>{const d=Math.round(dist),e=Number.isFinite(acc)?Math.round(acc):0;return`${Math.max(0,d-e)}M A ${d+e}M`};
const fmtAcc=a=>!Number.isFinite(a)?'—':`±${Math.round(a)}M`;
const nowBR=()=>new Date().toLocaleString('pt-BR').toUpperCase();
function findCol(h,cs){const m=h.map(norm);for(const c of cs){const i=m.indexOf(norm(c));if(i>=0)return i}return-1}
/* ===== STATE ===== */
let posts=[],kmDB=[],pos=null,searchItem=null,renderedKey='',apoioInit=false,rtInit=false;
let cam='',stream=null,hDir=null,capturing=false,buffer=[],kmIniLote='',lat='0.000000',lon='0.000000',wakeLock=null,cameras=[];
/* ===== TOAST ===== */
let _tt=null;
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  const icons={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>',err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'};
  el.className='toast '+type;
  el.innerHTML=(icons[type]||'')+msg;
  clearTimeout(_tt);
  requestAnimationFrame(()=>{el.classList.add('show');_tt=setTimeout(()=>el.classList.remove('show'),3000)});
}
/* ===== NAVIGATION ===== */
function openMod(id){
  const menu=document.getElementById('main-menu');
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  if(id==='menu'){menu.style.display='flex';return}
  menu.style.display='none';
  document.getElementById('mod-'+id).classList.add('active');
  if(id==='apoio')initApoio();
  if(id==='km')initRt();
}
/* ===== SPLASH ===== */
setTimeout(()=>document.getElementById('splash').classList.add('done'),2200);
/* ===== CLOCK ===== */
function tickClock(){
  const now=new Date();
  document.getElementById('menuClock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('menuDate').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
tickClock();setInterval(tickClock,1000);
/* ===== GPS BADGE ===== */
function gpsBadge(el,p,err){
  const a=p?.acc;let cls='bad',txt;
  if(err)txt=err;
  else if(!a)txt='GPS · BUSCANDO SINAL';
  else if(a<=ACC_G){cls='ok';txt=`GPS · ALTA PRECISÃO ${fmtAcc(a)}`}
  else if(a<=ACC_Y){cls='warn';txt=`GPS · PRECISÃO MÉDIA ${fmtAcc(a)}`}
  else txt=`GPS · SINAL FRACO ${fmtAcc(a)}`;
  el.className='gps '+cls;
  el.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>${txt}`;
}
/* ===== CSV ===== */
async function loadPosts(){
  try{
    let r=await fetch('dados.csv?v='+Date.now(),{cache:'no-store'}).catch(()=>null);
    if(!r?.ok)r=await fetch('Dados_Completos_Grupo_2_all.csv?v='+Date.now(),{cache:'no-store'});
    if(!r?.ok)return;
    let t=await r.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
    const lines=t.split(/\r?\n/).filter(l=>l.trim());
    const h=lines.shift().split(';');
    const iId=findCol(h,['id do nox','idnox','id']),iLat=findCol(h,['latitude','lat']),iLon=findCol(h,['longitude','lon','long']);
    posts=lines.map(l=>{const r=l.split(';');return{id:String(r[iId]||'').trim().toUpperCase(),lat:parsePt(r[iLat]),lon:parsePt(r[iLon])}}).filter(p=>p.id&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    renderApoio();
  }catch(e){}
}
async function loadKm(){
  try{
    let r=await fetch('SNVBR116SPRJ.csv?v='+Date.now(),{cache:'no-store'});
    if(!r?.ok)return;
    let t=await r.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
    const lines=t.split(/\r?\n/).filter(l=>l.trim());
    const h=lines.shift().split(';');
    const iKm=findCol(h,['km']),iLat=findCol(h,['lat','latitude']),iLon=findCol(h,['lon','long','longitude']);
    kmDB=lines.map(l=>{const r=l.split(';');return{km:parsePt(r[iKm]),lat:parsePt(r[iLat]),lon:parsePt(r[iLon])}}).filter(p=>Number.isFinite(p.km)&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    updateKm();
  }catch(e){}
}
/* ===== KM CÁLCULO ===== */
function nearestKm(){
  if(!pos||!kmDB.length)return null;
  let best=null,bd=Infinity;
  for(const p of kmDB){
    const d=hav(pos.lat,pos.lon,p.lat,p.lon);
    if(d<bd){bd=d;best=p}
  }
  return best;
}
function kmAt(lat,lon){
  if(!kmDB.length)return null;
  let best=null,bd=Infinity;
  for(const p of kmDB){
    const d=hav(lat,lon,p.lat,p.lon);
    if(d<bd){bd=d;best=p}
  }
  return best;
}
function updateKm(){
  const b=nearestKm();
  if(b){
    const v=(Math.round(b.km*100)/100).toFixed(2).replace('.',',');
    document.getElementById('kmVal').textContent=v;
    const s=document.getElementById('kmSource');
    if(s)s.textContent=`Referência: ${kmDB.length} pontos`;
  }
}
/* ===== APOIO ===== */
function initApoio(){
  if(apoioInit)return;apoioInit=true;
  loadPosts();loadKm();
  if('geolocation'in navigator)navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    gpsBadge(document.getElementById('gpsStatus'),pos);
    renderApoio();
    updateKm();
    updateSearchDist();
  },null,{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
function searchId(){
  const term=norm(document.getElementById('inputId').value),
        msg=document.getElementById('searchMsg'),
        res=document.getElementById('searchResult');
  if(!term){clearId();return}
  if(!posts.length){
    msg.style.display='flex';
    msg.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Carregando dados, tente novamente...';
    return;
  }
  const found=posts.find(p=>norm(p.id)===term||norm(p.id).includes(term));
  if(!found){
    msg.style.display='flex';
    msg.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>ID "${term}" NÃO ENCONTRADO.`;
    searchItem=null;res.style.display='none';checkLock();return;
  }
  searchItem=found;msg.style.display='none';
  renderSearch();
  showToast('Poste encontrado: '+found.id);
}
function clearId(){
  document.getElementById('inputId').value='';
  document.getElementById('searchMsg').style.display='none';
  document.getElementById('searchResult').style.display='none';
  searchItem=null;
  checkLock();
}
function updateSearchDist(){
  if(!searchItem||!pos)return;
  const el=document.getElementById('srch-dist');
  const kmEl=document.getElementById('srch-km');
  const dist=hav(pos.lat,pos.lon,searchItem.lat,searchItem.lon);
  if(el)el.textContent='Distância: '+range(dist,pos.acc);
  if(kmEl){
    const k=kmAt(searchItem.lat,searchItem.lon);
    kmEl.textContent=k?('KM aprox: '+(Math.round(k.km*100)/100).toFixed(2).replace('.',',')):'KM aprox: —';
  }
  checkLock();
}
function renderSearch(){
  if(!searchItem)return;
  const res=document.getElementById('searchResult');
  let dt='Aguardando GPS...';
  let kmTxt='KM aprox: —';
  if(pos){
    const dist=hav(pos.lat,pos.lon,searchItem.lat,searchItem.lon);
    dt='Distância: '+range(dist,pos.acc);
    const k=kmAt(searchItem.lat,searchItem.lon);
    if(k)kmTxt='KM aprox: '+(Math.round(k.km*100)/100).toFixed(2).replace('.',',');
    checkLock();
  }
  res.style.display='block';
  res.innerHTML=`<div class="post searched"

>     <div class="post-top"

>       <div class="post-info"

>         <p class="post-id">OS / ID: <span>${searchItem.id}</span></p>
        <p class="post-dist" id="srch-dist">${dt}</p>
        <p class="post-km" id="srch-km">${kmTxt}</p>
        <p class="post-coords">Coordenadas: ${searchItem.lat.toFixed(6)}, ${searchItem.lon.toFixed(6)}</p>
      </div>
      <span class="post-pin"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
    </div>
    <iframe class="post-map" src="https://maps.google.com/maps?q=${searchItem.lat},${searchItem.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
  </div>`;
}
function checkLock(){
  const b=document.getElementById('targetLock');
  if(!searchItem||!pos){b.classList.remove('on');return}
  const d=hav(pos.lat,pos.lon,searchItem.lat,searchItem.lon);
  if(d<=(5+(pos.acc||10))){
    b.classList.add('on');
    document.getElementById('targetLockSub').textContent=`ID ALVO: ${searchItem.id} · DISTÂNCIA EST. ~${Math.round(d)}M`;
  }else{
    b.classList.remove('on');
  }
}
function renderApoio(){
  if(!pos||!posts.length)return;
  if(searchItem)updateSearchDist();
  const qty=Number(document.getElementById('qty').value||10);
  // calcula distância e KM de cada poste em um único loop
  const items=posts.map(p=>{
    const d=hav(pos.lat,pos.lon,p.lat,p.lon);
    const k=kmAt(p.lat,p.lon);
    return {id:p.id,lat:p.lat,lon:p.lon,d,km:k?k.km:null};
  }).sort((a,b)=>a.d-b.d).slice(0,qty);

  const key=items.map(i=>i.id).join(',');
  const list=document.getElementById('postList');
  if(key===renderedKey){
    // apenas atualiza textos, sem recriar DOM
    items.forEach((o,i)=>{
      const el=document.getElementById('dist-'+i);
      const kmEl=document.getElementById('km-'+i);
      if(el)el.textContent='Distância: '+range(o.d,pos.acc);
      if(kmEl)kmEl.textContent=o.km!=null?('KM aprox: '+o.km.toFixed(2).replace('.',',')):'KM aprox: —';
    });
    document.getElementById('btnSend').disabled=false;
    return;
  }

  renderedKey=key;
  list.innerHTML='';
  items.forEach((o,i)=>{
    const kmLabel=o.km!=null?('KM aprox: '+o.km.toFixed(2).replace('.',',')):'KM aprox: —';
    const div=document.createElement('div');
    div.className='post'+(i===0?' near':'');
    div.innerHTML=`<div class="post-top"

>       <input type="checkbox" class="post-chk" value="${o.id}" data-lat="${o.lat}" data-lon="${o.lon}" checked>
      <div class="post-info"

>         <p class="post-id">Poste: <span>${o.id}</span></p>
        <p class="post-dist" id="dist-${i}">Distância: ${range(o.d,pos.acc)}</p>
        <p class="post-km" id="km-${i}">${kmLabel}</p>
      </div>
      <span class="post-pin"

>         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
    </div>
    <iframe class="post-map" src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>`;
    list.appendChild(div);
  });
  document.getElementById('btnSend').disabled=false;
}
document.getElementById('btnSend').onclick=()=>{
  if(!pos)return;
  const chks=document.querySelectorAll('.post-chk:checked');
  let items=[];
  if(chks.length){
    chks.forEach(c=>items.push({id:c.value,lat:parseFloat(c.dataset.lat),lon:parseFloat(c.dataset.lon)}));
  }else{
    const qty=Number(document.getElementById('qty').value||10);
    items=posts.map(p=>({...p,d:hav(pos.lat,pos.lon,p.lat,p.lon)})).sort((a,b)=>a.d-b.d).slice(0,qty).map(o=>({id:o.id,lat:o.lat,lon:o.lon}));
  }
  let tx=`📍 *LISTA DE LOCALIZAÇÃO DE POSTES*\nData/Hora: ${nowBR()}\nGPS Atual: ${pos.lat.toFixed(6)}, ${pos.lon.toFixed(6)} (${fmtAcc(pos.acc)})\n\n`;
  items.forEach((o,i)=>{
    tx+=`${i+1}. *ID:* ${o.id}\n`;
    const k=kmAt(o.lat,o.lon);
    if(k)tx+=`   KM aprox: ${(Math.round(k.km*100)/100).toFixed(2).replace('.',',')}\n`;
    if(document.getElementById('chkMaps').checked)tx+=`   🗺️ https://maps.google.com/?q=${o.lat.toFixed(6)},${o.lon.toFixed(6)}\n`;
  });
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank','noopener');
  showToast(`${items.length} postes enviados`);
};
document.getElementById('qty').onchange=()=>{renderedKey='';renderApoio()};
/* ===== KM RT ===== */
function initRt(){
  if(!kmDB.length)loadKm();
  if(rtInit)return;rtInit=true;
  if(!('geolocation'in navigator)){
    gpsBadge(document.getElementById('rtGps'),null,'GPS não suportado');
    return;
  }
  navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    gpsBadge(document.getElementById('rtGps'),pos);
    const co=document.getElementById('rtCoords');
    if(co)co.textContent=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
    if(kmDB.length){
      let best=null,bd=Infinity;
      for(const pt of kmDB){
        const d=hav(pos.lat,pos.lon,pt.lat,pt.lon);
        if(d<bd){bd=d;best=pt}
      }
      if(best)document.getElementById('rtKm').textContent=(Math.round(best.km*100)/100).toFixed(2).replace('.',',');
    }
  },()=>gpsBadge(document.getElementById('rtGps'),null,'Erro ao obter localização'),{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
