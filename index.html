<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Relatórios</title>
    <!-- Bootstrap CSS (CDN otimizado) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <!-- Estilos adicionais -->
    <style>
        body {
            padding-top: 56px; /* Espaço para a navbar fixa */
        }
        /* Customizações rápidas */
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 56px;
            left: 0;
            padding: 1rem;
            width: 250px;
            background-color: #f8f9fa;
            overflow-y: auto;
        }
        .content {
            margin-left: 250px;
            padding: 1rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }
            .content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema Relatórios</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Relatórios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Configurações</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Barra lateral de navegação -->
    <div class="sidebar">
        <h5>Menu</h5>
        <ul class="nav flex-column" id="menu">
            <li class="nav-item">
                <a class="nav-link active" href="#" onclick="mostrarFuncionalidade('dashboard')">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="mostrarFuncionalidade('cadastro')">Cadastro</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="mostrarFuncionalidade('relatorios')">Relatórios</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="mostrarFuncionalidade('exportar')">Exportar</a>
            </li>
            <!-- Adicione mais itens aqui até atingir 500 funções -->
        </ul>
    </div>

    <!-- Área principal de conteúdo -->
    <div class="content" id="conteudo">
        <h2>Bem-vindo ao Sistema</h2>
        <p>Selecione uma funcionalidade no menu para começar.</p>
    </div>

    <!-- Bootstrap JS (Bundle com Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script para controle de funcionalidades -->
    <script>
        // Exemplo de função para trocar conteúdo dinamicamente
        function mostrarFuncionalidade(func) {
            const conteudo = document.getElementById('conteudo');
            switch (func) {
                case 'dashboard':
                    conteudo.innerHTML = `
                        <h2>Dashboard</h2>
                        <p>Aqui você vê um resumo do sistema.</p>
                        <!-- Pode incluir gráficos, tabelas, etc. -->
                    `;
                    break;
                case 'cadastro':
                    conteudo.innerHTML = `
                        <h2>Cadastro</h2>
                        <form id="formCadastro">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" required />
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required />
                            </div>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </form>
                    `;
                    // Aqui você pode adicionar lógica para salvar o cadastro
                    document.getElementById('formCadastro').addEventListener('submit', function(e) {
                        e.preventDefault();
                        alert('Cadastro salvo!');
                    });
                    break;
                case 'relatorios':
                    conteudo.innerHTML = `
                        <h2>Relatórios</h2>
                        <p>Gerar relatórios personalizados aqui.</p>
                        <!-- Inserir filtros, botões de geração, etc. -->
                    `;
                    break;
                case 'exportar':
                    conteudo.innerHTML = `
                        <h2>Exportar Dados</h2>
                        <p>Opções de exportação disponíveis.</p>
                        <button class="btn btn-success" onclick="exportarRelatorio()">Exportar para PDF</button>
                    `;
                    break;
                default:
                    conteudo.innerHTML = `
                        <h2>Bem-vindo ao Sistema</h2>
                        <p>Selecione uma funcionalidade no menu para começar.</p>
                    `;
            }
        }

        // Exemplo de função de exportação
        function exportarRelatorio() {
            alert('Funcionalidade de exportação ativada.');
            // Aqui você pode integrar com APIs de backend ou gerar relatórios client-side
        }
    </script>
</body>
</html>
